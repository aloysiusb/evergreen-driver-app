services:
  - type: web
    name: evergreen-driver-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ROUTE_SHEET_ID
        sync: false   # set manually in Render dashboard
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false   # paste full service account JSON — set in Render dashboard only
      - key: PHOTOS_FOLDER_ID
        sync: false   # Drive folder for driver photos, shared with the service account
      - key: GOOGLE_MAPS_API_KEY
        sync: false   # browser-facing Maps key - restrict by HTTP referrer, NOT the service account key
      - key: DATA_DIR
        value: /data
    disk:
      name: evergreen-data
      mountPath: /data
      sizeGB: 1
