<!DOCTYPE html>
<html lang="en" data-radius="tight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch — Evergreen Compost</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
/* ── Tokens ── */
:root {
  --bg:       #f2f7f3;
  --surface:  #ffffff;
  --border:   #d4e8d8;
  --accent:   #16a34a;
  --text:     #1a2b1d;
  --muted:    #5e7e63;
  --muted-bg: #e8f2ea;
  --done:     #16a34a;
  --warn:     #d97706;
  --danger:   #dc2626;
  --ws-ok:    #22c55e;
  --ws-bad:   #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #0c160e;
    --surface:  #141f16;
    --border:   #1e3022;
    --accent:   #4ade80;
    --text:     #e2ede4;
    --muted:    #6b9070;
    --muted-bg: #1a2e1d;
    --done:     #4ade80;
    --warn:     #fbbf24;
    --danger:   #f87171;
  }
}
:root[data-theme="dark"] {
  --bg:       #0c160e;
  --surface:  #141f16;
  --border:   #1e3022;
  --accent:   #4ade80;
  --text:     #e2ede4;
  --muted:    #6b9070;
  --muted-bg: #1a2e1d;
  --done:     #4ade80;
  --warn:     #fbbf24;
  --danger:   #f87171;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── Header ── */
.dispatch-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-mark {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border-radius: var(--r-panel);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.brand-name {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.1;
}
.brand-sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}
.today-label {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ws-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--r-circle);
  background: var(--ws-bad);
  transition: background 0.4s;
  flex-shrink: 0;
}
.ws-dot.live { background: var(--ws-ok); }
.ws-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.05em;
  font-weight: 500;
}

/* Fleet summary bar */
.fleet-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.fleet-stat {
  display: flex;
  align-items: baseline;
  gap: 5px;
}
.fleet-num {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.fleet-num.accent { color: var(--accent); }
.fleet-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.fleet-progress {
  flex: 1;
  min-width: 120px;
  height: 6px;
  background: var(--border);
  border-radius: var(--r-chip);
  overflow: hidden;
}
.fleet-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--r-chip);
  transition: width 0.5s ease;
}
.fleet-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* ── Grid ── */
/* ── The day's feed ───────────────────────────────────────────────────
   Everything the drivers do, in order, as it happens. The route cards above
   answer "how far along is each truck"; this answers "what just happened",
   which is the thing you otherwise have to ask someone. */
.feed-wrap {
  max-width: 1400px;
  margin: 0 auto 26px;
  padding: 0 20px;
}
.feed-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}
.feed-title {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.feed-count { font-size: 12.5px; color: var(--muted); }

.feed {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  max-height: 310px;
  overflow-y: auto;
}
.feed-empty { padding: 20px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }

.feed-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 3px 12px;
  align-items: baseline;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.feed-item:last-child { border-bottom: 0; }

/* A stripe carries the kind, so a wall of text is scannable at a glance. */
.feed-item.done   { border-left: 3px solid var(--done); }
.feed-item.note   { border-left: 3px solid var(--accent); }
.feed-item.issue  { border-left: 3px solid var(--warn); }
.feed-item.undone { border-left: 3px solid var(--muted); }
.feed-item.photo  { border-left: 3px solid var(--blue, #1e4e79); }
.feed-photo {
  display: inline-block;
  margin-top: 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
}

.feed-icon { font-size: 14px; line-height: 1.4; }
.feed-body { min-width: 0; }
.feed-who {
  font-weight: 600;
  font-size: 13.5px;
}
.feed-what {
  font-size: 13px;
  color: var(--muted);
  word-break: break-word;
}
.feed-time {
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.feed-route {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: 1px;
}

.grid-wrap {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  align-items: start;
}

/* ── Route card ── */
.route-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sheet);
  overflow: hidden;
  transition: opacity 0.2s;
}
.route-card.off-day {
  opacity: 0.45;
}
.route-card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.route-stripe {
  width: 4px;
  align-self: stretch;
  border-radius: var(--r-chip);
  flex-shrink: 0;
}
.route-info { flex: 1; min-width: 0; }
.route-name {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.route-day-chip {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: var(--r-control);
  margin-top: 3px;
}
.route-day-chip.today {
  background: var(--accent);
  color: #fff;
}
.route-day-chip.off {
  background: var(--muted-bg);
  color: var(--muted);
}
.route-status-icon {
  font-size: 20px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* Progress */
.route-progress {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 7px;
}
.progress-fraction {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.progress-pct {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: var(--r-control);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: var(--r-control);
  transition: width 0.5s ease;
}

/* Current stop */
.current-stop {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  min-height: 64px;
}
.current-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.current-name {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.current-addr {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.current-empty {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
}

/* Incidents */
.incidents {
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 42px;
}
.incident-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: var(--r-card);
  white-space: nowrap;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.incident-chip.contamination { background: #fee2e2; color: #dc2626; }
.incident-chip.overflow      { background: #fef3c7; color: #d97706; }
.incident-chip.skip          { background: var(--muted-bg); color: var(--muted); }
.incident-chip.photo         { background: #dbeafe; color: #1d4ed8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .incident-chip.contamination { background: #450a0a; color: #fca5a5; }
  :root:not([data-theme="light"]) .incident-chip.overflow      { background: #451a03; color: #fcd34d; }
  :root:not([data-theme="light"]) .incident-chip.photo         { background: #0c1e40; color: #93c5fd; }
}
:root[data-theme="dark"] .incident-chip.contamination { background: #450a0a; color: #fca5a5; }
:root[data-theme="dark"] .incident-chip.overflow      { background: #451a03; color: #fcd34d; }
:root[data-theme="dark"] .incident-chip.photo         { background: #0c1e40; color: #93c5fd; }

.no-incidents {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
  align-self: center;
}

/* Loading/error states */
.loading-grid {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: var(--r-circle);
  animation: spin 0.7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  .progress-fill, .fleet-progress-fill { transition: none; }
}

/* Theme toggle */
.theme-toggle {
  background: var(--muted-bg);
  border: none;
  border-radius: var(--r-card);
  padding: 5px 10px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.theme-toggle:hover { color: var(--text); }
</style>
</head>
<body>

<header class="dispatch-header">
  <div class="header-top">
    <div class="header-brand">
      <div class="brand-mark">🌿</div>
      <div>
        <div class="brand-name">Evergreen Compost</div>
        <div class="brand-sub">Dispatch</div>
      </div>
    </div>
    <div class="header-meta">
      <div class="today-label" id="today-label"></div>
      <div class="fleet-divider"></div>
      <div class="ws-dot" id="ws-dot"></div>
      <div class="ws-label" id="ws-label">Connecting…</div>
      <div class="fleet-divider"></div>
      <button class="theme-toggle" onclick="toggleTheme()">☀ / ☾</button>
    </div>
  </div>
  <div class="fleet-bar" id="fleet-bar">
    <div class="fleet-stat">
      <div class="fleet-num accent" id="fleet-done">—</div>
      <div class="fleet-label">stops done</div>
    </div>
    <div class="fleet-stat">
      <div class="fleet-num" id="fleet-total">—</div>
      <div class="fleet-label">total stops</div>
    </div>
    <div class="fleet-progress">
      <div class="fleet-progress-fill" id="fleet-fill" style="width:0%"></div>
    </div>
    <div class="fleet-stat">
      <div class="fleet-num" id="fleet-incidents" style="color:var(--warn)">0</div>
      <div class="fleet-label">incidents today</div>
    </div>
  </div>
</header>

<div class="feed-wrap">
  <div class="feed-head">
    <h2 class="feed-title">As it happens</h2>
    <span class="feed-count" id="feed-count">nothing yet today</span>
  </div>
  <div class="feed" id="feed">
    <div class="feed-empty">
      Stops marked done, notes written and incidents filed will appear here the
      moment a driver taps them. Nothing to refresh.
    </div>
  </div>
</div>

<div class="grid-wrap" id="grid">
  <div class="loading-grid"><div class="spinner"></div>Loading routes…</div>
</div>

<script>
// ── Route definitions (mirrors routes.js) ─────────────────────────────────
const ROUTES = [
  { id:'tues-dv',          tabName:'Tues DV',              day:'Tuesday',   name:'Valley Route',      color:'#0ea5e9' },
  { id:'tues-4wd',         tabName:'TUES 4WD ACTION',      day:'Tuesday',   name:'4WD Action',        color:'#f97316' },
  { id:'weds-res',         tabName:'Weds DV Res',          day:'Wednesday', name:'Valley Residential', color:'#22c55e' },
  { id:'weds-commercial',  tabName:'Weds Commercial',      day:'Wednesday', name:'Commercial',         color:'#a855f7' },
  { id:'thurs-uv',         tabName:'Thurs UV',             day:'Thursday',  name:'Upper Valley',       color:'#06b6d4' },
  { id:'thurs-comeagle',   tabName:'Thursday COMEAGLE',    day:'Thursday',  name:'Com / Eagle',        color:'#ef4444' },
  { id:'friday',           tabName:'Friday',               day:'Friday',    name:'Friday Route',       color:'#eab308' },
  { id:'monday',           tabName:'Monday',               day:'Monday',    name:'Monday Route',       color:'#ec4899' },
  { id:'max-routes',       tabName:'Max Routes',           day:'Daily',     name:'Max Routes',         color:'#6366f1' },
];

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const today = DAYS[new Date().getDay()];
document.getElementById('today-label').textContent = today;

// ── State ─────────────────────────────────────────────────────────────────
const routeState = {};  // tabName → { items, error }

// ── Incident detection ────────────────────────────────────────────────────
function parseIncidents(items) {
  const chips = [];
  for (const s of items) {
    if (!s.notes) continue;
    const n = s.notes;
    if (n.startsWith('🚫'))      chips.push({ type:'contamination', label: n.slice(0, 40) });
    else if (n.startsWith('📦')) chips.push({ type:'overflow',      label: n.slice(0, 40) });
    else if (n.startsWith('⏭')) chips.push({ type:'skip',          label: n.slice(0, 40) });
    else if (n.startsWith('📷')) chips.push({ type:'photo',         label: n.slice(0, 40) });
  }
  return chips;
}

// ── Render one card ───────────────────────────────────────────────────────
function renderCard(route) {
  const state = routeState[route.tabName];
  const isToday = route.day === today || route.day === 'Daily';
  const card = document.getElementById('card-' + route.id) || makeCardEl(route.id);

  if (!state) {
    card.innerHTML = cardSkeleton(route, isToday);
    return card;
  }
  if (state.error) {
    card.innerHTML = cardError(route, isToday);
    return card;
  }

  const stops = state.items.filter(s => !s.isSectionHeader);
  const done  = stops.filter(s => s.done).length;
  const total = stops.length;
  const pct   = total > 0 ? Math.round(done / total * 100) : 0;
  const current = stops.find(s => !s.done);
  const incidents = parseIncidents(stops);

  const statusIcon = pct === 100 ? '✅' : isToday ? '🚛' : '⏸';

  const incidentHtml = incidents.length
    ? incidents.slice(0, 4).map(c =>
        `<span class="incident-chip ${c.type}" title="${esc(c.label)}">${esc(c.label)}</span>`
      ).join('')
    : `<span class="no-incidents">No incidents</span>`;

  const currentHtml = !current
    ? `<div class="current-empty">All stops complete</div>`
    : `<div class="current-name">${esc(current.accountName || current.address)}</div>
       ${(current.accountName && current.address)
          ? `<div class="current-addr">${esc(current.address)}${current.city ? ', ' + current.city : ''}</div>`
          : current.city ? `<div class="current-addr">${esc(current.city)}</div>` : ''}`;

  card.className = 'route-card' + (isToday ? '' : ' off-day');
  card.innerHTML = `
    <div class="route-card-top">
      <div class="route-stripe" style="background:${route.color};"></div>
      <div class="route-info">
        <div class="route-name">${esc(route.name)}</div>
        <div class="route-day-chip ${isToday ? 'today' : 'off'}">${esc(route.day)}</div>
      </div>
      <div class="route-status-icon">${statusIcon}</div>
    </div>
    <div class="route-progress">
      <div class="progress-row">
        <span class="progress-fraction" style="color:${route.color};">${done}<span style="font-size:13px;font-weight:500;color:var(--muted)"> / ${total}</span></span>
        <span class="progress-pct">${pct}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:${route.color};"></div>
      </div>
    </div>
    <div class="current-stop">
      <div class="current-label">Current stop</div>
      ${currentHtml}
    </div>
    <div class="incidents">${incidentHtml}</div>`;

  return card;
}

function cardSkeleton(route, isToday) {
  return `<div class="route-card-top">
      <div class="route-stripe" style="background:${route.color};"></div>
      <div class="route-info">
        <div class="route-name">${esc(route.name)}</div>
        <div class="route-day-chip ${isToday ? 'today' : 'off'}">${esc(route.day)}</div>
      </div>
    </div>
    <div style="padding:20px 16px;color:var(--muted);font-size:13px;">Loading…</div>`;
}

function cardError(route, isToday) {
  return `<div class="route-card-top">
      <div class="route-stripe" style="background:${route.color};"></div>
      <div class="route-info">
        <div class="route-name">${esc(route.name)}</div>
        <div class="route-day-chip ${isToday ? 'today' : 'off'}">${esc(route.day)}</div>
      </div>
    </div>
    <div style="padding:16px;font-size:12px;color:var(--danger);">Could not load route</div>`;
}

function makeCardEl(id) {
  const el = document.createElement('div');
  el.id = 'card-' + id;
  el.className = 'route-card';
  return el;
}

// ── Fleet summary ─────────────────────────────────────────────────────────
function updateFleet() {
  let totalDone = 0, totalAll = 0, totalIncidents = 0;
  for (const route of ROUTES) {
    const state = routeState[route.tabName];
    if (!state || state.error) continue;
    const stops = state.items.filter(s => !s.isSectionHeader);
    totalAll  += stops.length;
    totalDone += stops.filter(s => s.done).length;
    totalIncidents += parseIncidents(stops).length;
  }
  const pct = totalAll > 0 ? Math.round(totalDone / totalAll * 100) : 0;
  document.getElementById('fleet-done').textContent = totalDone;
  document.getElementById('fleet-total').textContent = totalAll;
  document.getElementById('fleet-fill').style.width = pct + '%';
  document.getElementById('fleet-incidents').textContent = totalIncidents;
}

// ── Full re-render ────────────────────────────────────────────────────────
function renderAll() {
  const grid = document.getElementById('grid');
  // Build or update cards
  ROUTES.forEach(route => {
    let card = document.getElementById('card-' + route.id);
    const isNew = !card;
    if (isNew) {
      card = makeCardEl(route.id);
      grid.appendChild(card);
    }
    renderCard(route);
  });
  updateFleet();
}

// ── Fetch all routes ──────────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('grid').innerHTML = '<div class="loading-grid"><div class="spinner"></div>Loading all routes…</div>';
  await Promise.all(ROUTES.map(async route => {
    try {
      const res = await fetch('/api/routes/' + encodeURIComponent(route.tabName));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      routeState[route.tabName] = { items: data.items };
    } catch {
      routeState[route.tabName] = { error: true };
    }
  }));
  document.getElementById('grid').innerHTML = '';
  renderAll();
}

// ── WebSocket ─────────────────────────────────────────────────────────────
let ws, wsTimer;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('live');
    document.getElementById('ws-label').textContent = 'Live';
    if (wsTimer) { clearTimeout(wsTimer); wsTimer = null; }
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('live');
    document.getElementById('ws-label').textContent = 'Reconnecting…';
    wsTimer = setTimeout(connectWS, 4000);
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    const route = ROUTES.find(r => r.tabName === msg.tabName);
    if (!route) return;
    const state = routeState[route.tabName];
    if (!state || state.error) return;

    if (msg.type === 'stop-updated') {
      const s = state.items.find(x => x.rowNumber === msg.rowNumber);
      if (s) s.done = msg.done;
      addFeed({
        kind: msg.done ? 'done' : 'undone',
        icon: msg.done ? '✅' : '↩️',
        who: stopLabel(s),
        what: msg.done ? 'Marked done' : 'Reopened',
        routeName: route.name,
        color: route.color,
      });
      renderCard(route);
      updateFleet();
    }
    if (msg.type === 'note-updated') {
      const s = state.items.find(x => x.rowNumber === msg.rowNumber);
      if (s) { s.notes = msg.notes; s.noteUrgency = msg.noteUrgency; }
      const photo = String(msg.notes || '').match(/https://drive.google.com/S+/);
      const incident = isIncident(msg.notes);
      addFeed({
        kind: photo ? 'photo' : incident ? 'issue' : 'note',
        icon: photo ? '📷' : incident ? '⚠️' : '📝',
        link: photo ? photo[0] : null,
        who: stopLabel(s),
        what: msg.notes,
        routeName: route.name,
        color: route.color,
      });
      renderCard(route);
      updateFleet();
    }
  };
}

// ── The day's feed ────────────────────────────────────────────────────────
//
// The WebSocket was already carrying every one of these events — they were
// used to repaint a card and then dropped. Keeping them in order turns the
// board from "how far along is each truck" into "what has happened today",
// which is the question you otherwise have to interrupt someone to answer.

const feed = [];
const FEED_MAX = 120;   // a day's worth; the oldest fall off rather than growing forever

function stopLabel(item) {
  if (!item) return 'a stop';
  return item.accountName || item.address || 'a stop';
}

/* Incidents are notes that start with one of the report marks, so they can be
   told apart from something a driver typed. */
function isIncident(text) {
  return /(^|·\s*)(🚫|📦|⏭|📷)/.test(String(text || ''));
}

function addFeed(entry) {
  feed.unshift({ ...entry, at: new Date() });
  if (feed.length > FEED_MAX) feed.length = FEED_MAX;
  renderFeed();
}

function renderFeed() {
  const el = document.getElementById('feed');
  const count = document.getElementById('feed-count');
  if (!el) return;

  if (!feed.length) return;   // leave the explanatory empty state in place

  count.textContent = feed.length === 1 ? '1 update' : feed.length + ' updates';

  el.innerHTML = feed.map(f => {
    const time = f.at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const routeChip = f.routeName
      ? '<span class="feed-route" style="background:' + f.color + '22;color:' + f.color + '">'
        + esc(f.routeName) + '</span>'
      : '';
    return '<div class="feed-item ' + f.kind + '">' +
      '<span class="feed-icon">' + f.icon + '</span>' +
      '<div class="feed-body">' +
        '<div class="feed-who">' + esc(f.who) + routeChip + '</div>' +
        (f.what ? '<div class="feed-what">' + esc(f.what) + '</div>' : '') +
        (f.link ? '<a class="feed-photo" href="' + esc(f.link) + '" target="_blank" rel="noopener">📷 Open photo</a>' : '') +
      '</div>' +
      '<span class="feed-time">' + time + '</span>' +
    '</div>';
  }).join('');
}

// ── Theme toggle ──────────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

// ── Esc util ──────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────────
loadAll();
connectWS();
// Refresh every 5 min in case WebSocket misses something
setInterval(loadAll, 5 * 60 * 1000);
</script>
