<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evergreen Compost — Routes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<div class="home-header">
  <a class="dispatch-link" href="/dispatch">📡 Dispatcher Dashboard</a>
  <div class="home-logo" id="site-logo"></div>
  <h1 id="site-heading">Evergreen Compost</h1>
  <p id="site-subhead">Tap your route to get started</p>
</div>

<div class="route-grid" id="route-grid"></div>



<script src="/js/report-errors.js"></script>
<script src="/js/fonts.js"></script>
<script src="/js/style-units.js"></script>
<script src="/js/styles.js"></script>
<script src="/js/routes.js"></script>
<script>
const grid = document.getElementById('route-grid');

/* The variable loop lives in styles.js now; everything below is the part
   that is specific to this page. { socket: true } because the home page has
   no WebSocket of its own, so a style change would otherwise not reach it
   until the next reload. */
/* Draw the cards straight away from the colours built into routes.js, then
   redraw when the saved ones arrive. A driver opening this on a bad
   connection sees their routes immediately rather than an empty screen, and
   there is no separate failure path to get wrong. */
function renderRoutes(styles) {
  const cardText = (styles && styles['route-card-text']) || '#ffffff';
  grid.innerHTML = ROUTES.map(r => {
    const bg = (styles && styles['route-' + r.id]) || r.color;
    return `<a class="route-card" href="/driver/${r.id}" style="background:${bg};color:${cardText};">
      <div class="route-card-day">${r.day}</div>
      <div class="route-card-name">${r.name}</div>
    </a>`;
  }).join('');
}

renderRoutes(null);

/* { socket: true } because this page has no WebSocket of its own, so a style
   change would otherwise not reach it until the next reload. */
initStyles(styles => {
  // Editable home page content (empty string → element hidden via CSS :empty)
  document.getElementById('site-logo').textContent    = styles['site-logo']    ?? '';
  document.getElementById('site-heading').textContent = styles['site-heading'] ?? 'Evergreen Compost';
  document.getElementById('site-subhead').textContent = styles['site-subhead'] ?? '';
  renderRoutes(styles);
}, { socket: true });
</script>
</body>
</html>
