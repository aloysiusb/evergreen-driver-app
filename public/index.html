<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evergreen Compost — Routes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<div class="home-header">
  <div class="home-logo" id="site-logo">🌿</div>
  <h1 id="site-heading">Evergreen Compost</h1>
  <p id="site-subhead">Tap your route to get started</p>
</div>

<div class="route-grid" id="route-grid"></div>

<script src="/js/routes.js"></script>
<script>
const grid = document.getElementById('route-grid');

fetch('/api/styles').then(r => r.json()).then(styles => {
  // Apply global CSS vars
  const root = document.documentElement;
  for (const [key, val] of Object.entries(styles)) {
    if (key.startsWith('--')) {
      const needsPx = key === '--radius' || key === '--route-card-radius' || key.endsWith('-font-size') || key.endsWith('-padding');
      root.style.setProperty(key, needsPx ? val + 'px' : val);
    }
  }
  // Apply editable home page content (empty string → element hidden via CSS :empty)
  document.getElementById('site-logo').textContent    = styles['site-logo']    ?? '🌿';
  document.getElementById('site-heading').textContent = styles['site-heading'] ?? 'Evergreen Compost';
  document.getElementById('site-subhead').textContent = styles['site-subhead'] ?? '';
  // Render route cards using stored colors
  const cardText = styles['route-card-text'] || '#ffffff';
  grid.innerHTML = ROUTES.map(r => {
    const bg = styles['route-' + r.id] || r.color;
    return `<a class="route-card" href="/driver/${r.id}" style="background:${bg};color:${cardText};">
      <div class="route-card-day">${r.day}</div>
      <div class="route-card-name">${r.name}</div>
    </a>`;
  }).join('');
}).catch(() => {
  // Fallback to hardcoded colors if API fails
  grid.innerHTML = ROUTES.map(r => `
    <a class="route-card" href="/driver/${r.id}" style="background:${r.color};">
      <div class="route-card-day">${r.day}</div>
      <div class="route-card-name">${r.name}</div>
    </a>`).join('');
});
</script>
</body>
</html>
