<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Demo — Evergreen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f5faf6;
  --surface:  #ffffff;
  --border:   #d8ead9;
  --accent:   #16a34a;
  --accent-l: #dcfce7;
  --text:     #1a2b1d;
  --muted:    #5e7e63;
  --amber:    #d97706;
  --amber-l:  #fef3c7;
  --blue:     #1d4ed8;
  --blue-l:   #dbeafe;
  --red:      #dc2626;
  --red-l:    #fee2e2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c160e; --surface: #141f16; --border: #1e3022;
    --accent: #4ade80; --accent-l: #14532d; --text: #e2ede4; --muted: #6b9070;
    --amber-l: #451a03; --blue-l: #0c1e40; --blue: #93c5fd; --red-l: #450a0a; --red: #fca5a5;
  }
}
:root[data-theme="dark"] {
  --bg: #0c160e; --surface: #141f16; --border: #1e3022;
  --accent: #4ade80; --accent-l: #14532d; --text: #e2ede4; --muted: #6b9070;
  --amber-l: #451a03; --blue-l: #0c1e40; --blue: #93c5fd; --red-l: #450a0a; --red: #fca5a5;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 14px;
}

/* Header */
.demo-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.demo-brand {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.demo-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: 5px;
}
.demo-controls {
  display: flex;
  gap: 8px;
  margin-left: auto;
  align-items: center;
}
.ctrl-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.ctrl-btn:disabled { opacity: 0.4; cursor: default; }
.ctrl-btn.ghost {
  background: var(--border);
  color: var(--text);
}
.speed-label { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Layout */
.demo-wrap {
  display: grid;
  grid-template-columns: 1fr;
  max-width: 520px;
  margin: 0 auto;
  padding: 12px;
  gap: 12px;
}

/* Map */
#demo-map {
  width: 100%;
  height: 340px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--border);
}
#demo-loading {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* Nav card */
.nav-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
}
.nav-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.mode-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--accent-l);
  color: var(--accent);
  letter-spacing: 0.05em;
}
.eta-badge {
  font-size: 11px;
  font-weight: 700;
  background: var(--blue-l);
  color: var(--blue);
  padding: 3px 9px;
  border-radius: 6px;
}
.nav-name {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 21px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 2px;
}
.nav-addr { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

.access-chip {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  background: var(--blue-l);
  color: var(--blue);
  padding: 5px 11px;
  border-radius: 8px;
  margin-bottom: 8px;
}
.nav-note {
  font-size: 13px;
  background: var(--accent-l);
  border-left: 3px solid var(--accent);
  padding: 8px 11px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 10px;
  line-height: 1.5;
}
.nav-note.urgent { background: var(--red-l); border-left-color: var(--red); }
.nav-note.hold   { background: var(--amber-l); border-left-color: var(--amber); }

.report-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.rbtn {
  flex: 1;
  min-width: calc(50% - 3px);
  padding: 8px 6px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
}
.rbtn.active-demo { animation: pulse 0.6s ease 2; }
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.04); box-shadow: 0 0 0 3px var(--accent-l); }
}

.nav-actions { display: flex; gap: 6px; }
.nav-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
  background: var(--border);
  color: var(--text);
}
.nav-btn.done { background: var(--accent); color: #fff; flex: 1.3; }
.nav-btn.maps { background: var(--blue-l); color: var(--blue); }

/* Arrival toast */
#arrival-toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--text);
  color: var(--bg);
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 90vw;
}
#arrival-toast.show { transform: translateX(-50%) translateY(0); }
.toast-done-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 5px 12px;
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
}

/* Caption bar */
.caption {
  background: var(--surface);
  border: 1.5px solid var(--accent);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.55;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.caption-icon { font-size: 18px; flex-shrink: 0; }
.caption b { font-weight: 600; color: var(--accent); }

/* Progress dots */
.stop-dots {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 2px 0;
}
.sdot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.3s;
}
.sdot.done { background: var(--accent); }
.sdot.current { background: var(--blue); transform: scale(1.4); }

.footer-note {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 8px 20px 24px;
}
.footer-note a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div class="demo-header">
  <div class="demo-brand">🌿 Navigation <span class="demo-badge">Live Demo</span></div>
  <div class="demo-controls">
    <span class="speed-label" id="speed-label">1×</span>
    <button class="ctrl-btn ghost" id="speed-btn" onclick="cycleSpeed()">Speed</button>
    <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶ Play</button>
  </div>
</div>

<div class="demo-wrap">
  <div class="caption" id="caption">
    <span class="caption-icon">🚛</span>
    <span id="caption-text">Loading a real route from your Google Sheet…</span>
  </div>

  <div id="demo-loading">Loading map and route data…</div>
  <div id="demo-map" style="display:none;"></div>

  <div class="stop-dots" id="stop-dots"></div>

  <div class="nav-card" id="nav-card" style="display:none;"></div>
</div>

<div class="footer-note">
  This is a live simulation using <b>real stops and notes</b> from your Google Sheet.<br>
  <a href="/round2.html">← Back to overview</a> · <a href="/dispatch.html">Dispatcher Dashboard</a>
</div>

<div id="arrival-toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let map, stops = [], path = [], pathIdx = 0, curStop = 0;
let driverMarker, markers = [], playing = false, rafId = null;
let speed = 1;
const SPEEDS = [1, 2, 4];
let doneSet = new Set();

const DEMO_TABS = ['Tues DV', 'Weds DV Res', 'Monday', 'Friday', 'Thurs UV'];

// ── Boot ──────────────────────────────────────────────────────────────────
(async function boot() {
  let apiKey;
  try {
    const r = await fetch('/api/maps-key');
    apiKey = (await r.json()).key;
  } catch {
    setCaption('⚠️', 'Maps key not configured.');
    return;
  }

  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry`;
    s.async = true; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });

  // Find a route with enough stops
  let items = null;
  for (const tab of DEMO_TABS) {
    try {
      const r = await fetch('/api/routes/' + encodeURIComponent(tab));
      if (!r.ok) continue;
      const d = await r.json();
      const s = d.items.filter(x => !x.isSectionHeader && x.address);
      if (s.length >= 4) { items = s.slice(0, 6); break; }
    } catch {}
  }
  if (!items) { setCaption('⚠️', 'No route data available.'); return; }

  setCaption('📍', `Locating ${items.length} stops…`);

  // Geocode
  const geocoder = new google.maps.Geocoder();
  await Promise.all(items.map(st => new Promise(res => {
    geocoder.geocode({ address: st.address + (st.city ? ', ' + st.city : '') + ', TX' }, (r, status) => {
      if (status === 'OK' && r[0]) { st.pos = r[0].geometry.location; stops.push(st); }
      res();
    });
  })));

  if (stops.length < 2) { setCaption('⚠️', 'Could not locate enough stops.'); return; }
  stops.sort((a,b) => items.indexOf(a) - items.indexOf(b));

  // Map
  document.getElementById('demo-loading').style.display = 'none';
  document.getElementById('demo-map').style.display = 'block';
  map = new google.maps.Map(document.getElementById('demo-map'), {
    zoom: 14, center: stops[0].pos,
    mapTypeControl: false, fullscreenControl: false, streetViewControl: false,
    gestureHandling: 'greedy',
  });
  new google.maps.TrafficLayer().setMap(map);

  markers = stops.map((st, i) => new google.maps.Marker({
    position: st.pos, map,
    icon: pin(i === 0 ? 'current' : 'pending'),
    zIndex: 10,
  }));

  // Route polyline
  const ds = new google.maps.DirectionsService();
  const dr = new google.maps.DirectionsRenderer({
    map, suppressMarkers: true,
    polylineOptions: { strokeColor: '#22c55e', strokeWeight: 5, strokeOpacity: 0.8 },
  });

  await new Promise(res => {
    ds.route({
      origin: stops[0].pos,
      destination: stops[stops.length-1].pos,
      waypoints: stops.slice(1,-1).map(s => ({ location: s.pos, stopover: true })),
      travelMode: google.maps.TravelMode.DRIVING,
    }, (result, status) => {
      if (status === 'OK') {
        dr.setDirections(result);
        path = result.routes[0].overview_path;
      }
      res();
    });
  });

  driverMarker = new google.maps.Marker({
    position: stops[0].pos, map,
    icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: '#2563eb', fillOpacity: 1,
            strokeColor: '#fff', strokeWeight: 3, scale: 9 },
    zIndex: 200,
  });

  renderDots();
  renderCard();
  document.getElementById('nav-card').style.display = 'block';
  setCaption('🚛', `Real route loaded — <b>${stops.length} stops</b> with live notes from your sheet. Press <b>Play</b> to watch a driver run it.`);
})();

// ── Pin styles ────────────────────────────────────────────────────────────
function pin(kind) {
  const c = { current: '#2563eb', pending: '#86efac', done: '#d1d5db' }[kind];
  return { path: google.maps.SymbolPath.CIRCLE, fillColor: c, fillOpacity: 1,
           strokeColor: '#fff', strokeWeight: 2, scale: kind === 'current' ? 11 : 7 };
}

// ── Animation ─────────────────────────────────────────────────────────────
function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) step(); else cancelAnimationFrame(rafId);
}

function cycleSpeed() {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  document.getElementById('speed-label').textContent = speed + '×';
}

function step() {
  if (!playing || !path.length) return;
  pathIdx += speed * 1.6;

  if (pathIdx >= path.length) {
    finishDemo();
    return;
  }

  const p = path[Math.floor(pathIdx)];
  driverMarker.setPosition(p);
  map.panTo(p);

  // Distance to current stop
  const target = stops[curStop];
  if (target && !doneSet.has(curStop)) {
    const d = google.maps.geometry.spherical.computeDistanceBetween(p, target.pos);
    updateEta(d);
    if (d < 90) { arriveAt(curStop); }
  }

  rafId = requestAnimationFrame(step);
}

function updateEta(metres) {
  const mins = Math.max(1, Math.round(metres / 400)); // ~24 km/h city avg
  const el = document.getElementById('eta-badge');
  if (el) el.textContent = `🚗 ${mins} min away`;
}

function arriveAt(idx) {
  if (doneSet.has(idx)) return;
  playing = false;
  cancelAnimationFrame(rafId);
  document.getElementById('play-btn').textContent = '▶ Play';

  const st = stops[idx];
  const toast = document.getElementById('arrival-toast');
  toast.innerHTML = `<span>📍 Arrived at <b>${esc(st.accountName || st.address)}</b>?</span>
    <button class="toast-done-btn" onclick="confirmArrival(${idx})">✓ Done</button>`;
  toast.classList.add('show');

  setCaption('📍', `Driver pulled within <b>80 metres</b> — the app automatically asks if they've arrived. One tap marks it done.`);
}

function confirmArrival(idx) {
  document.getElementById('arrival-toast').classList.remove('show');
  doneSet.add(idx);
  markers[idx].setIcon(pin('done'));

  // Show a report demo at the second stop
  if (idx === 1) {
    setCaption('📋', `Stop complete. If the driver spots <b>contamination or overflow</b>, those four buttons file a structured report straight to your sheet — two taps.`);
    const btn = document.querySelector('.rbtn');
    if (btn) btn.classList.add('active-demo');
  } else {
    setCaption('✅', `Marked done — <b>synced to your Google Sheet instantly</b>, and the dispatcher dashboard updates in real time.`);
  }

  curStop++;
  if (curStop < stops.length) markers[curStop].setIcon(pin('current'));
  renderDots();
  renderCard();

  if (curStop >= stops.length) { finishDemo(); return; }

  setTimeout(() => {
    if (curStop < stops.length) {
      playing = true;
      document.getElementById('play-btn').textContent = '⏸ Pause';
      step();
    }
  }, 2600);
}

function finishDemo() {
  playing = false;
  cancelAnimationFrame(rafId);
  document.getElementById('play-btn').textContent = '↻ Replay';
  document.getElementById('play-btn').onclick = () => location.reload();
  setCaption('🎉', `Route complete — every stop logged, every note saved, and dispatch saw it all happen <b>live</b>.`);
}

// ── Render ────────────────────────────────────────────────────────────────
function renderDots() {
  document.getElementById('stop-dots').innerHTML = stops.map((_, i) =>
    `<div class="sdot ${doneSet.has(i) ? 'done' : i === curStop ? 'current' : ''}"></div>`
  ).join('');
}

function renderCard() {
  const st = stops[Math.min(curStop, stops.length - 1)];
  if (!st) return;
  const allDone = curStop >= stops.length;

  const noteCls = !st.notes ? '' :
    /skip|hold|cancel/i.test(st.notes) ? ' hold' :
    /get |asap|today|now|eow/i.test(st.notes) ? ' urgent' : '';

  document.getElementById('nav-card').innerHTML = `
    <div class="nav-top">
      <span>${Math.min(curStop+1, stops.length)} of ${stops.length} <span class="mode-badge">📋 PLANNED</span></span>
      <span>${doneSet.size} done ${!allDone ? `<span class="eta-badge" id="eta-badge">🚗 — min away</span>` : ''}</span>
    </div>
    <div class="nav-name">${esc(st.accountName || st.address)}</div>
    ${st.accountName ? `<div class="nav-addr">${esc(st.address)}${st.city ? ', ' + st.city : ''}</div>` : ''}
    ${st.directions ? `<div class="access-chip">🔑 ${esc(st.directions)}</div>` : ''}
    ${st.notes ? `<div class="nav-note${noteCls}">${esc(st.notes)}</div>` : ''}
    <div class="report-btns">
      <div class="rbtn">🚫 Contamination</div>
      <div class="rbtn">📦 Overflow</div>
      <div class="rbtn">⏭ Skip</div>
      <div class="rbtn">📷 Photo</div>
    </div>
    <div class="nav-actions">
      <div class="nav-btn">← Prev</div>
      <div class="nav-btn maps">↗ Navigate</div>
      <div class="nav-btn done">✓ Done</div>
      <div class="nav-btn">Next →</div>
    </div>`;
}

function setCaption(icon, html) {
  document.querySelector('.caption-icon').textContent = icon;
  document.getElementById('caption-text').innerHTML = html;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
