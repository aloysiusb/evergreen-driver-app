<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Demo — Evergreen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<!-- The same map interface the driver app draws, from the same file, so the
     demo cannot drift into showing something the app does not. -->
<link rel="stylesheet" href="/css/map-ui.css">
<style>
:root {
  --bg:       #f5faf6;
  --surface:  #ffffff;
  --border:   #d8ead9;
  --accent:   #16a34a;
  --accent-l: #dcfce7;
  --text:     #1a2b1d;
  --muted:    #5e7e63;
  --amber:    #d97706;
  --amber-l:  #fef3c7;
  --blue:     #1d4ed8;
  --blue-l:   #dbeafe;
  --red:      #dc2626;
  --red-l:    #fee2e2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c160e; --surface: #141f16; --border: #1e3022;
    --accent: #4ade80; --accent-l: #14532d; --text: #e2ede4; --muted: #6b9070;
    --amber-l: #451a03; --blue-l: #0c1e40; --blue: #93c5fd; --red-l: #450a0a; --red: #fca5a5;
  }
}
:root[data-theme="dark"] {
  --bg: #0c160e; --surface: #141f16; --border: #1e3022;
  --accent: #4ade80; --accent-l: #14532d; --text: #e2ede4; --muted: #6b9070;
  --amber-l: #451a03; --blue-l: #0c1e40; --blue: #93c5fd; --red-l: #450a0a; --red: #fca5a5;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 14px;
}

/* Header */
.demo-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.demo-brand {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.demo-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: var(--r-control);
}
.demo-controls {
  display: flex;
  gap: 8px;
  margin-left: auto;
  align-items: center;
}
.ctrl-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r-card);
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.ctrl-btn:disabled { opacity: 0.4; cursor: default; }
.ctrl-btn.ghost {
  background: var(--border);
  color: var(--text);
}
.speed-label { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Layout */
.demo-wrap {
  display: grid;
  grid-template-columns: 1fr;
  max-width: 520px;
  margin: 0 auto;
  padding: 12px;
  gap: 12px;
}

/* Map */
#demo-map {
  width: 100%;
  height: clamp(240px,45vh,340px);
  border-radius: var(--r-panel);
  border: 1.5px solid var(--border);
  background: var(--border);
}
#demo-loading {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* Nav card */
.nav-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-panel);
  padding: 14px 16px;
}
.nav-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.mode-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--r-control);
  background: var(--accent-l);
  color: var(--accent);
  letter-spacing: 0.05em;
}
.eta-badge {
  font-size: 11px;
  font-weight: 700;
  background: var(--blue-l);
  color: var(--blue);
  padding: 3px 9px;
  border-radius: var(--r-control);
}
.nav-name {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 21px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 2px;
}
.nav-addr { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

.access-chip {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  background: var(--blue-l);
  color: var(--blue);
  padding: 5px 11px;
  border-radius: var(--r-card);
  margin-bottom: 8px;
}
.nav-note {
  font-size: 13px;
  background: var(--accent-l);
  border-left: 3px solid var(--accent);
  padding: 8px 11px;
  border-radius: 0 var(--r-card) var(--r-card) 0;
  margin-bottom: 10px;
  line-height: 1.5;
}
.nav-note.urgent { background: var(--red-l); border-left-color: var(--red); }
.nav-note.hold   { background: var(--amber-l); border-left-color: var(--amber); }

.report-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.rbtn {
  flex: 1;
  min-width: calc(50% - 3px);
  padding: 8px 6px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-card);
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
}
.rbtn.active-demo { animation: pulse 0.6s ease 2; }
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.04); box-shadow: 0 0 0 3px var(--accent-l); }
}

.nav-actions { display: flex; gap: 6px; }
.nav-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: var(--r-card);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
  background: var(--border);
  color: var(--text);
}
.nav-btn.done { background: var(--accent); color: #fff; flex: 1.3; }
.nav-btn.maps { background: var(--blue-l); color: var(--blue); }

/* Arrival toast */
#arrival-toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--text);
  color: var(--bg);
  padding: 13px 20px;
  border-radius: var(--r-panel);
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 90vw;
}
#arrival-toast.show { transform: translateX(-50%) translateY(0); }
.toast-done-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r-control);
  padding: 5px 12px;
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
}

/* Caption bar */
.caption {
  background: var(--surface);
  border: 1.5px solid var(--accent);
  border-radius: var(--r-panel);
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.55;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.caption-icon { font-size: 18px; flex-shrink: 0; }
.caption b { font-weight: 600; color: var(--accent); }

/* Progress dots */
.stop-dots {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 2px 0;
}
.sdot {
  width: 7px; height: 7px;
  border-radius: var(--r-circle);
  background: var(--border);
  transition: background 0.3s;
}
.sdot.done { background: var(--accent); }
.sdot.current { background: var(--blue); transform: scale(1.4); }

.footer-note {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 8px 20px 24px;
}
.footer-note a { color: var(--accent); font-weight: 600; }

/* ── View toggle ── */

/* ── Turn-by-turn banner ── */

/* Speed readout */
.speed-pill {
  background: rgba(255,255,255,0.12);
  border-radius: var(--r-card);
  padding: 5px 10px;
  text-align: center;
  flex-shrink: 0;
}
.speed-num {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.speed-unit { font-size: 9px; opacity: 0.7; letter-spacing: 0.05em; }

/* Driving mode map sizing */
#demo-map.driving { height: clamp(260px,50vh,400px); }

/* ── Traffic status bar ── */
.traffic-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-panel);
  padding: 10px 14px;
  font-size: 13px;
  flex-wrap: wrap;
}
.traffic-pill {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--r-control);
}
.traffic-pill.light    { background: var(--accent-l); color: var(--accent); }
.traffic-pill.moderate { background: var(--amber-l);  color: var(--amber); }
.traffic-pill.heavy    { background: var(--red-l);    color: var(--red); }
.route-time {
  font-family: 'Barlow Semi Condensed', sans-serif;
  font-weight: 700;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.mode-mini {
  margin-left: auto;
  display: flex;
  gap: 3px;
  background: var(--border);
  border-radius: var(--r-card);
  padding: 2px;
}
.mode-mini-btn {
  padding: 4px 10px;
  border: none;
  border-radius: var(--r-control);
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}
.mode-mini-btn.on { background: var(--surface); color: var(--text); }

/* ── Nav app picker ── */
.nav-apps {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.nav-app {
  flex: 1;
  padding: 8px 4px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-card);
  background: var(--surface);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  color: var(--text);
}

/* ── Reroute alert ── */
#reroute-alert {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-160%);
  background: var(--amber);
  color: #fff;
  padding: 12px 18px;
  border-radius: var(--r-panel);
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
  z-index: 110;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 92vw;
}
#reroute-alert.show { transform: translateX(-50%) translateY(0); }
.reroute-btn {
  background: #fff;
  color: #b45309;
  border: none;
  border-radius: var(--r-control);
  padding: 5px 12px;
  font-weight: 700;
  font-size: 12px;
  font-family: inherit;
}

/* ── Touch sizing ──────────────────────────────────────────────────────────
   Last in the file so it wins over the rules above, which set the padding
   these heights override. 44px is Apple's minimum and roughly a fingertip;
   these are the controls someone taps while holding the phone up to show
   the app, so they were the wrong ones to have at 29px. */
.ctrl-btn, .vt-btn {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>

<div class="demo-header">
  <div class="demo-brand">🌿 Navigation <span class="demo-badge">Live Demo</span></div>
  <div class="demo-controls">
    <span class="speed-label" id="speed-label">1×</span>
    <button class="ctrl-btn ghost" id="speed-btn" onclick="cycleSpeed()">Speed</button>
    <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶ Play</button>
  </div>
</div>

<div class="demo-wrap">
  <div class="caption" id="caption">
    <span class="caption-icon">🚛</span>
    <span id="caption-text">Loading a real route from your Google Sheet…</span>
  </div>

  <div class="speed-pill" id="demo-speed">
    <div class="speed-num" id="speed-num">0</div>
    <div class="speed-unit">MPH</div>
  </div>

  <div class="traffic-bar" id="traffic-bar" style="display:none;">
    <span class="route-time" id="route-time">—</span>
    <span class="traffic-pill light" id="traffic-pill">🟢 Light traffic</span>
    <div class="mode-mini">
      <button class="mode-mini-btn on" id="mm-planned">📋 PLANNED</button>
      <button class="mode-mini-btn" id="mm-live">⚡ LIVE</button>
    </div>
  </div>

  <div id="demo-loading">Loading map and route data…</div>

  <!-- Same shape as the driver app: the map, with its interface floating on
       top of it rather than stacked around it. -->
  <div id="map-wrap">
    <div id="demo-map" class="driving" style="display:none;"></div>

    <div id="map-hud">
      <div id="geo-chip">
        <svg class="geo-rose" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="rose-ring" cx="32" cy="32" r="29"/>
          <circle class="rose-hub" cx="32" cy="32" r="2.5"/>
          <text class="rose-pt rose-n" x="32" y="13">N</text>
          <text class="rose-pt" x="56" y="36">E</text>
          <text class="rose-pt" x="32" y="60">S</text>
          <text class="rose-pt" x="8"  y="36">W</text>
          <g id="geo-needle">
            <polygon class="rose-needle-n" points="32,10 26.5,33 37.5,33"/>
            <polygon class="rose-needle-s" points="32,54 26.5,33 37.5,33"/>
          </g>
        </svg>
        <span class="geo-read"><span class="geo-coords" id="geo-coords">—</span></span>
      </div>

      <div id="turn-banner" class="show">
        <div class="turn-arrow" id="turn-arrow">↑</div>
        <div class="turn-info">
          <div class="turn-source">Live directions</div>
          <div class="turn-dist" id="turn-dist">—</div>
          <div class="turn-text" id="turn-text">Starting route…</div>
          <div class="turn-next" id="turn-next"></div>
          <div class="turn-conditions" id="turn-conditions"></div>
        </div>
      </div>
    </div>

    <div id="map-dock">
      <button class="dock-btn active" id="vt-driving" onclick="setView('driving')" title="Close in, riding with the truck">
        <span class="dock-ico">🧭</span><span class="dock-cap">Driving</span></button>
      <button class="dock-btn" id="vt-overview" onclick="setView('overview')" title="Step back to see the whole round">
        <span class="dock-ico">🔭</span><span class="dock-cap">Route</span></button>
      <button class="dock-btn" id="vt-sat" onclick="toggleSatellite()" title="Aerial imagery">
        <span class="dock-ico">🛰</span><span class="dock-cap">Sat</span></button>
      <!-- Folds the tray away, the same handle the driver app has. Stays
           visible when it is folded, because a control that hides itself along
           with everything else is a control nobody gets back. -->
      <button id="dock-toggle" onclick="toggleDock()" aria-expanded="true"
              aria-controls="map-dock" title="Hide the buttons"></button>
    </div>
  </div>

  <div class="stop-dots" id="stop-dots"></div>

  <div class="nav-card" id="nav-card" style="display:none;"></div>
</div>

<div class="footer-note">
  This is a live simulation using <b>real stops and notes</b> from your Google Sheet.<br>
  <a href="/round2.html">← Back to overview</a> · <a href="/dispatch.html">Dispatcher Dashboard</a>
</div>

<div id="arrival-toast"></div>
<div id="reroute-alert"></div>

<script src="/js/map-dock.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────
let map, stops = [], path = [], pathIdx = 0, curStop = 0;
let driverMarker, markers = [], playing = false, rafId = null;
let speed = 1;
const SPEEDS = [1, 2, 4];
let doneSet = new Set();
let viewMode = 'driving';   // 'driving' | 'overview'
let routeMins = null, trafficDelay = null, rerouteShown = false, trafficLayer = null;
let turnSteps = [];         // flattened maneuver steps from Directions
let curHeading = 0;

/* Matches ZOOM_DRIVING in map.js: far enough back to read the grid of the
   roads, not so close the next turn is off the screen. The two are separate
   because the demo does not load map.js; if one moves, move both. */
const DRIVING_ZOOM = 16;
const OVERVIEW_ZOOM = 14;

/* The vector Map ID, if the server has one. This page has always asked for
   tilt: 45 and rotated the map with setHeading, and neither has ever done
   anything — both need a vector map, and a map is only vector when it is
   created with a Map ID made for vector rendering in the Google Cloud console.
   Without one the demo is flat and north-up, which is what it looks like
   today. Set GOOGLE_MAPS_MAP_ID and the tilt it already asks for arrives. */
let mapId = null;

// Maneuver → arrow glyph
const MANEUVER_ICONS = {
  'turn-right': '↱', 'turn-left': '↰',
  'turn-slight-right': '↗', 'turn-slight-left': '↖',
  'turn-sharp-right': '⤳', 'turn-sharp-left': '⤪',
  'uturn-right': '⤵', 'uturn-left': '⤴',
  'merge': '⤸', 'fork-right': '↗', 'fork-left': '↖',
  'ramp-right': '↗', 'ramp-left': '↖',
  'roundabout-right': '⟳', 'roundabout-left': '⟲',
  'straight': '↑',
};

const DEMO_TABS = ['Tues DV', 'Weds DV Res', 'Monday', 'Friday', 'Thurs UV'];

// ── Boot ──────────────────────────────────────────────────────────────────
(async function boot() {
  let apiKey;
  try {
    const r = await fetch('/api/maps-key');
    /* fetch resolves on a 404, and the error body parses as JSON, so without
       these two checks the key is silently undefined and the page asks Google
       for ?key=undefined — leaving the map stuck on "Loading" with no reason
       given. Same checks map.js and walkthrough.html make. */
    if (!r.ok) throw new Error('maps key not configured');
    const cfg = await r.json();
    apiKey = cfg.key;
    mapId = cfg.mapId || null;
    if (!apiKey) throw new Error('maps key empty');
  } catch {
    setCaption('⚠️', 'Maps key not configured.');
    return;
  }

  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry` +
            (mapId ? `&map_ids=${encodeURIComponent(mapId)}` : '');
    s.async = true; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });

  // Find a route with enough stops
  let items = null;
  for (const tab of DEMO_TABS) {
    try {
      const r = await fetch('/api/routes/' + encodeURIComponent(tab));
      if (!r.ok) continue;
      const d = await r.json();
      // Real stops only — must have a street number (filters out note rows)
      const s = d.items.filter(x => !x.isSectionHeader && /^\d+\s+\S/.test((x.address || '').trim()));
      if (s.length >= 4) { items = s.slice(0, 6); break; }
    } catch {
      // Deliberate: we are probing tabs in turn and a miss is expected.
      // The loop moves on; only running out of tabs is a real failure.
    }
  }
  if (!items) { setCaption('⚠️', 'No route data available.'); return; }

  setCaption('📍', `Locating ${items.length} stops…`);

  // Geocode
  const geocoder = new google.maps.Geocoder();
  await Promise.all(items.map(st => new Promise(res => {
    geocoder.geocode({ address: st.address + (st.city ? ', ' + st.city : '') + ', CO' }, (r, status) => {
      if (status === 'OK' && r[0]) { st.pos = r[0].geometry.location; stops.push(st); }
      res();
    });
  })));

  // Drop any geocode that landed far from the cluster (bad address match)
  if (stops.length >= 3) {
    const lats = stops.map(s => s.pos.lat()).sort((a,b)=>a-b);
    const lngs = stops.map(s => s.pos.lng()).sort((a,b)=>a-b);
    const mLat = lats[Math.floor(lats.length/2)], mLng = lngs[Math.floor(lngs.length/2)];
    stops = stops.filter(s => {
      const dLat = (s.pos.lat() - mLat) * 111;
      const dLng = (s.pos.lng() - mLng) * 111 * Math.cos(mLat * Math.PI/180);
      return Math.sqrt(dLat*dLat + dLng*dLng) < 80;
    });
  }

  if (stops.length < 2) { setCaption('⚠️', 'Could not locate enough stops.'); return; }
  stops.sort((a,b) => items.indexOf(a) - items.indexOf(b));

  // Map
  document.getElementById('demo-loading').style.display = 'none';
  document.getElementById('demo-map').style.display = 'block';
  map = new google.maps.Map(document.getElementById('demo-map'), {
    zoom: DRIVING_ZOOM,
    center: stops[0].pos,
    gestureHandling: 'greedy',
    tilt: 45,
    // Passed only when one is configured: a mapId of null or '' is not the
    // same as no mapId, it asks Google for a map that does not exist and the
    // map fails to load instead of falling back.
    ...(mapId ? { mapId } : {}),
    // Full Google Maps controls
    mapTypeControl: true,
    mapTypeControlOptions: {
      style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
      position: google.maps.ControlPosition.TOP_LEFT,
      mapTypeIds: ['roadmap', 'satellite', 'hybrid', 'terrain'],
    },
    fullscreenControl: true,
    streetViewControl: true,
    zoomControl: true,
    scaleControl: true,
    rotateControl: true,
    clickableIcons: true,     // POIs tappable — gas, food, etc.
  });
  trafficLayer = new google.maps.TrafficLayer();
  trafficLayer.setMap(map);

  markers = stops.map((st, i) => new google.maps.Marker({
    position: st.pos, map,
    icon: pin(i === 0 ? 'current' : 'pending'),
    zIndex: 10,
  }));

  // Route polyline
  const ds = new google.maps.DirectionsService();
  const dr = new google.maps.DirectionsRenderer({
    map, suppressMarkers: true,
    polylineOptions: { strokeColor: '#22c55e', strokeWeight: 5, strokeOpacity: 0.8 },
  });

  await new Promise(res => {
    ds.route({
      origin: stops[0].pos,
      destination: stops[stops.length-1].pos,
      waypoints: stops.slice(1,-1).map(s => ({ location: s.pos, stopover: true })),
      travelMode: google.maps.TravelMode.DRIVING,
    }, (result, status) => {
      if (status === 'OK') {
        dr.setDirections(result);
        // Real traffic numbers for this route, right now
        const legs = result.routes[0].legs;
        routeMins = Math.round(legs.reduce((s,l) => s + (l.duration_in_traffic||l.duration).value, 0) / 60);
        const freeFlow = Math.round(legs.reduce((s,l) => s + l.duration.value, 0) / 60);
        trafficDelay = Math.max(0, routeMins - freeFlow);
        showTraffic();
        // Build a dense path from every step's polyline for smooth close-up motion
        const dense = [];
        result.routes[0].legs.forEach(leg => {
          leg.steps.forEach(st => {
            turnSteps.push({
              start: st.start_location,
              instruction: st.instructions.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(),
              distanceText: st.distance.text,
              distanceM: st.distance.value,
              maneuver: st.maneuver || 'straight',
              pathStart: dense.length,
            });
            st.path.forEach(p => dense.push(p));
          });
        });
        path = dense.length ? dense : result.routes[0].overview_path;
      } else {
        // Without this the demo just sits there with no route and no reason.
        console.warn('[demo] directions:', status);
        setCaption('⚠️', 'Could not load the route just now — ' + status + '.');
      }
      res();
    });
  });

  driverMarker = new google.maps.Marker({
    position: stops[0].pos, map,
    icon: driverIcon(0),
    zIndex: 200,
  });

  // The driver begins at their first stop with it already collected, and
  // drives to the next one — otherwise the arrival check fires instantly
  // because the route polyline starts on top of stop 1.
  doneSet.add(0);
  markers[0].setIcon(pin('done'));
  curStop = 1;
  markers[1].setIcon(pin('current'));

  renderDots();
  renderCard();
  document.getElementById('nav-card').style.display = 'block';
  setView('driving');
  setCaption('🧭', `Real route loaded — <b>${stops.length} stops</b> with live notes from your sheet. Press <b>Play</b> for close-up turn-by-turn navigation.`);
})();

// ── Satellite toggle ──────────────────────────────────────────────────────
function toggleSatellite() {
  if (!map) return;
  const isSat = map.getMapTypeId() !== 'roadmap';
  map.setMapTypeId(isSat ? 'roadmap' : 'hybrid');  // hybrid = aerial + street labels
  document.getElementById('vt-sat').classList.toggle('active', !isSat);
  if (!isSat) {
    setCaption('🛰', `<b>Satellite view</b> — drivers can see actual driveways, bin placement, and gate locations before they pull up. Especially useful on rural properties.`);
  }
}

// ── Traffic display ───────────────────────────────────────────────────────
function showTraffic() {
  if (routeMins === null) return;
  document.getElementById('traffic-bar').style.display = 'flex';
  document.getElementById('route-time').textContent = `~${routeMins} min`;
  const pill = document.getElementById('traffic-pill');
  if (trafficDelay <= 3) {
    pill.className = 'traffic-pill light';
    pill.textContent = '🟢 Light traffic';
  } else if (trafficDelay <= 12) {
    pill.className = 'traffic-pill moderate';
    pill.textContent = `🟡 Moderate · +${trafficDelay} min`;
  } else {
    pill.className = 'traffic-pill heavy';
    pill.textContent = `🔴 Heavy · +${trafficDelay} min`;
  }
}

// ── Reroute alert (scripted demo moment) ──────────────────────────────────
function showRerouteDemo() {
  if (rerouteShown) return;
  rerouteShown = true;
  const saving = 9 + Math.floor(Math.random() * 7);
  const el = document.getElementById('reroute-alert');
  el.innerHTML = `<span>⚡ Traffic shifted — <b>Live route saves ~${saving} min</b></span>
    <button class="reroute-btn" onclick="acceptReroute()">Switch</button>`;
  el.classList.add('show');
  setCaption('⚡', `The app re-checks traffic every 3 minutes. When conditions shift enough to matter, it offers a faster order — <b>but never reroutes on its own</b>. The driver decides.`);
  setTimeout(() => el.classList.remove('show'), 9000);
}

window.acceptReroute = function() {
  document.getElementById('reroute-alert').classList.remove('show');
  document.getElementById('mm-planned').classList.remove('on');
  document.getElementById('mm-live').classList.add('on');
  setCaption('⚡', `Switched to <b>Live mode</b> — remaining stops reordered for current traffic. The route line turns amber to show it's traffic-optimized.`);
};

// ── Driver arrow (rotates with heading) ───────────────────────────────────
function driverIcon(rotation) {
  return {
    path: 'M 0,-9 L 6,7 L 0,3 L -6,7 Z',   // chevron pointing "up"
    fillColor: '#2563eb',
    fillOpacity: 1,
    strokeColor: '#ffffff',
    strokeWeight: 2,
    scale: 1.5,
    rotation: rotation,
    anchor: new google.maps.Point(0, 0),
  };
}

// ── View mode ─────────────────────────────────────────────────────────────
function setView(mode) {
  viewMode = mode;
  document.getElementById('vt-driving').classList.toggle('active', mode === 'driving');
  document.getElementById('vt-overview').classList.toggle('active', mode === 'overview');
  document.getElementById('turn-banner').classList.toggle('show', mode === 'driving');
  document.getElementById('demo-map').classList.toggle('driving', mode === 'driving');

  if (!map) return;
  if (mode === 'driving') {
    map.setZoom(DRIVING_ZOOM);
    map.setTilt(45);
    if (driverMarker) map.panTo(driverMarker.getPosition());
  } else {
    map.setZoom(OVERVIEW_ZOOM);
    map.setTilt(0);
    map.setHeading(0);
    // Fit all stops
    const b = new google.maps.LatLngBounds();
    stops.forEach(s => b.extend(s.pos));
    map.fitBounds(b, 40);
  }
}

// ── Turn banner ───────────────────────────────────────────────────────────
function updateTurnBanner(pos) {
  if (viewMode !== 'driving' || !turnSteps.length) return;

  // Find the next step whose start is ahead of us on the path
  const idx = Math.floor(pathIdx);
  let next = turnSteps.find(s => s.pathStart > idx);
  const upcoming = next ? turnSteps[turnSteps.indexOf(next) + 1] : null;

  if (!next) {
    document.getElementById('turn-arrow').textContent = '🏁';
    document.getElementById('turn-dist').textContent = 'Arriving';
    document.getElementById('turn-text').textContent = stops[curStop]?.accountName || 'Destination';
    document.getElementById('turn-next').textContent = '';
    return;
  }

  const distM = google.maps.geometry.spherical.computeDistanceBetween(pos, next.start);
  const feet = Math.round(distM * 3.281);
  const distLabel = feet > 1000
    ? (distM / 1609).toFixed(1) + ' mi'
    : Math.max(50, Math.round(feet / 50) * 50) + ' ft';

  document.getElementById('turn-arrow').textContent = MANEUVER_ICONS[next.maneuver] || '↑';
  document.getElementById('turn-dist').textContent = distLabel;
  document.getElementById('turn-text').innerHTML = esc(next.instruction);
  document.getElementById('turn-next').textContent = upcoming
    ? 'Then: ' + upcoming.instruction.slice(0, 46)
    : 'Then: arrive at stop';
}

// ── Pin styles ────────────────────────────────────────────────────────────
function pin(kind) {
  const c = { current: '#2563eb', pending: '#86efac', done: '#d1d5db' }[kind];
  return { path: google.maps.SymbolPath.CIRCLE, fillColor: c, fillOpacity: 1,
           strokeColor: '#fff', strokeWeight: 2, scale: kind === 'current' ? 11 : 7 };
}

// ── Animation ─────────────────────────────────────────────────────────────
function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) step(); else cancelAnimationFrame(rafId);
}

function cycleSpeed() {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  document.getElementById('speed-label').textContent = speed + '×';
}

function step() {
  if (!playing || !path.length) return;
  pathIdx += speed * 0.9;

  if (pathIdx >= path.length) {
    finishDemo();
    return;
  }

  const i = Math.floor(pathIdx);
  const p = path[i];
  const ahead = path[Math.min(i + 3, path.length - 1)];

  // Heading — smooth toward the direction of travel
  if (ahead && ahead !== p) {
    const target = google.maps.geometry.spherical.computeHeading(p, ahead);
    let delta = ((target - curHeading + 540) % 360) - 180;
    curHeading = (curHeading + delta * 0.18 + 360) % 360;
  }

  driverMarker.setPosition(p);
  driverMarker.setIcon(driverIcon(curHeading));

  /* The head-up display, fed from the same heading and position the marker
     uses — so the demo's compass is showing the demo's truck, not a decoration
     that happens to spin. */
  const needle = document.getElementById('geo-needle');
  if (needle) needle.style.transform = 'rotate(' + Math.round(curHeading) + 'deg)';
  const coords = document.getElementById('geo-coords');
  if (coords) coords.textContent = p.lat().toFixed(5) + ', ' + p.lng().toFixed(5);

  if (viewMode === 'driving') {
    map.panTo(p);
    map.setHeading(curHeading);   // rotates so travel is always "up"
    // Simulated speed readout — faster on straights, slower near turns
    const mph = Math.round(18 + Math.sin(pathIdx / 25) * 9);
    document.getElementById('speed-num').textContent = Math.max(5, mph);
    updateTurnBanner(p);
    /* The traffic the demo already works out, shown where the driver app shows
       it — in the directions, not in a bar of its own. */
    const cond = document.getElementById('turn-conditions');
    const pill = document.getElementById('traffic-pill');
    if (cond && pill) {
      cond.innerHTML = '<span class="cond-chip">' + pill.textContent.trim() + '</span>';
    }
  } else {
    map.panTo(p);
  }

  // Distance to current stop
  const target = stops[curStop];
  if (target && !doneSet.has(curStop)) {
    const d = google.maps.geometry.spherical.computeDistanceBetween(p, target.pos);
    updateEta(d);
    if (d < 90) { arriveAt(curStop); }
  }

  rafId = requestAnimationFrame(step);
}

function updateEta(metres) {
  const mins = Math.max(1, Math.round(metres / 400)); // ~24 km/h city avg
  const el = document.getElementById('eta-badge');
  if (el) el.textContent = `🚗 ${mins} min away`;
}

function arriveAt(idx) {
  if (doneSet.has(idx)) return;
  playing = false;
  cancelAnimationFrame(rafId);
  document.getElementById('play-btn').textContent = '▶ Play';

  const st = stops[idx];
  document.getElementById('speed-num').textContent = '0';
  document.getElementById('turn-arrow').textContent = '🏁';
  document.getElementById('turn-dist').textContent = 'Arrived';
  document.getElementById('turn-text').textContent = st.accountName || st.address;
  document.getElementById('turn-next').textContent = '';

  const toast = document.getElementById('arrival-toast');
  toast.innerHTML = `<span>📍 Arrived at <b>${esc(st.accountName || st.address)}</b>?</span>
    <button class="toast-done-btn" onclick="confirmArrival(${idx})">✓ Done</button>`;
  toast.classList.add('show');

  setCaption('📍', `Driver pulled within <b>80 metres</b> — the app automatically asks if they've arrived. One tap marks it done.`);
}

function confirmArrival(idx) {
  document.getElementById('arrival-toast').classList.remove('show');
  doneSet.add(idx);
  markers[idx].setIcon(pin('done'));

  // Traffic reroute moment after the third stop
  if (idx === 2) {
    setTimeout(showRerouteDemo, 1400);
  }

  // Show a report demo at the second stop
  if (idx === 1) {
    setCaption('📋', `Stop complete. If the driver spots <b>contamination or overflow</b>, those four buttons file a structured report straight to your sheet — two taps.`);
    const btn = document.querySelector('.rbtn');
    if (btn) btn.classList.add('active-demo');
  } else {
    setCaption('✅', `Marked done — <b>synced to your Google Sheet instantly</b>, and the dispatcher dashboard updates in real time.`);
  }

  curStop++;
  if (curStop < stops.length) markers[curStop].setIcon(pin('current'));
  renderDots();
  renderCard();

  if (curStop >= stops.length) { finishDemo(); return; }

  setTimeout(() => {
    if (curStop < stops.length) {
      playing = true;
      document.getElementById('play-btn').textContent = '⏸ Pause';
      step();
    }
  }, 2600);
}

function finishDemo() {
  playing = false;
  cancelAnimationFrame(rafId);
  document.getElementById('play-btn').textContent = '↻ Replay';
  document.getElementById('play-btn').onclick = () => location.reload();
  setCaption('🎉', `Route complete — every stop logged, every note saved, and dispatch saw it all happen <b>live</b>.`);
}

// ── Render ────────────────────────────────────────────────────────────────
function renderDots() {
  document.getElementById('stop-dots').innerHTML = stops.map((_, i) =>
    `<div class="sdot ${doneSet.has(i) ? 'done' : i === curStop ? 'current' : ''}"></div>`
  ).join('');
}

function renderCard() {
  const st = stops[Math.min(curStop, stops.length - 1)];
  if (!st) return;
  const allDone = curStop >= stops.length;

  const noteCls = !st.notes ? '' :
    /skip|hold|cancel/i.test(st.notes) ? ' hold' :
    /get |asap|today|now|eow/i.test(st.notes) ? ' urgent' : '';

  document.getElementById('nav-card').innerHTML = `
    <div class="nav-top">
      <span>${Math.min(curStop+1, stops.length)} of ${stops.length} <span class="mode-badge">📋 PLANNED</span></span>
      <span>${doneSet.size} done ${!allDone ? `<span class="eta-badge" id="eta-badge">🚗 — min away</span>` : ''}</span>
    </div>
    <div class="nav-name">${esc(st.accountName || st.address)}</div>
    ${st.accountName ? `<div class="nav-addr">${esc(st.address)}${st.city ? ', ' + st.city : ''}</div>` : ''}
    ${st.directions ? `<div class="access-chip">🔑 ${esc(st.directions)}</div>` : ''}
    ${st.notes ? `<div class="nav-note${noteCls}">${esc(st.notes)}</div>` : ''}
    <div class="report-btns">
      <div class="rbtn">🚫 Contamination</div>
      <div class="rbtn">📦 Overflow</div>
      <div class="rbtn">⏭ Skip</div>
      <div class="rbtn">📷 Photo</div>
    </div>
    <div class="nav-apps">
      <div class="nav-app">🗺 Google Maps</div>
      <div class="nav-app">🚦 Waze</div>
      <div class="nav-app">🍎 Apple Maps</div>
    </div>
    <div class="nav-actions">
      <div class="nav-btn">← Prev</div>
      <div class="nav-btn maps">↗ Navigate</div>
      <div class="nav-btn done">✓ Done</div>
      <div class="nav-btn">Next →</div>
    </div>`;
}

function setCaption(icon, html) {
  document.querySelector('.caption-icon').textContent = icon;
  document.getElementById('caption-text').innerHTML = html;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// The browser pauses requestAnimationFrame in hidden tabs, so the loop dies
// if the viewer switches apps. Restart it when they come back.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && playing) {
    cancelAnimationFrame(rafId);
    step();
  }
});
</script>
</body>
</html>
