<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route — Evergreen Compost</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/chrome.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<header class="app-bar">
  <h1><span class="app-mark"></span><span class="app-name"></span> <span class="app-page">Route</span></h1>
  <nav><a href="/">Routes</a><a href="/dispatch">Dispatch</a></nav>
</header>


<!-- One line instead of four stacked blocks. This header was 182px tall on a
     phone — with the app bar above it, 221px, a quarter of the screen, before
     the map got a single pixel. Everything that was stacked is now on the same
     row: who you are, where you are up to, and the two views. The progress bar
     stays as a hairline under it, because a bar you can read at a glance is
     worth 3px. -->
<header class="route-header">
  <div class="route-line">
    <button class="hdr-menu" id="hdr-menu" onclick="toggleHeaderMenu()"
            aria-label="Menu" aria-expanded="false" aria-controls="hdr-drawer">☰</button>
    <div class="route-ident">
      <span class="route-title" id="route-name">Loading…</span>
      <span class="route-meta"><span id="route-day"></span><span id="route-date"></span></span>
    </div>
    <span class="progress-text" id="progress-text">Loading…</span>
    <!-- Smaller than they were, still the most obvious thing on the line. -->
    <div class="view-tabs">
      <button class="view-tab" id="tab-stops" onclick="switchView('stops')">Stops</button>
      <button class="view-tab active" id="tab-map" onclick="switchView('map')">Map</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <!-- On a phone the links and the date live in here instead of on the line.
       Stops / Map never does: it is the control, not a detail. -->
  <div class="hdr-drawer" id="hdr-drawer" hidden>
    <a href="/">⌂ All routes</a>
    <a href="/dispatch">📡 Dispatcher board</a>
    <span class="hdr-drawer-meta" id="drawer-meta"></span>
  </div>
</header>

<div id="ws-status">⚠ Reconnecting — changes may not sync live</div>
<div id="pending-status" style="display:none;"></div>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading route…</div>
</div>

<div id="main-content" style="display:none;">
  <div class="content" id="view-stops">
    <div id="stops-list"></div>
  </div>
  <div id="view-map" style="display:none;">
    <div id="map-wrap">
      <div id="route-map"></div>
      <div id="map-loading">Loading map…</div>
      <!-- The head-up display: where you are, which way you are pointing, and
           what is between here and the stop. Anchored over the map rather than
           stacked above it, so it costs the map no height and a driver reads it
           without looking away from the road. Transparent, on a scrim dark
           enough to carry white text over a pale road map as well as satellite.

           Nothing here reaches the bottom of the screen, so the report buttons
           down there are untouched. -->
      <div id="map-hud">
        <!-- Where you are and which way you are pointing, on the map itself.
             Top centre because Google owns both top corners (map type on the left,
             fullscreen on the right) and both bottom ones. Tap copies the
             coordinates, which is what you want when you are reading them to
             somebody over the radio. -->
        <div id="geo-chip">
          <!-- A real compass rose, not a letter. The rim is fixed with north at the
               top, and the needle turns — so "needle pointing up" means driving
               north, which is readable in the half-second a driver can spare.
               Translucent on purpose: it overlaps the map and is meant to. -->
          <svg class="geo-rose" viewBox="0 0 64 64" aria-hidden="true">
            <circle class="rose-ring" cx="32" cy="32" r="29"/>
            <circle class="rose-hub" cx="32" cy="32" r="2.5"/>
            <text class="rose-pt rose-n" x="32" y="13">N</text>
            <text class="rose-pt" x="56" y="36">E</text>
            <text class="rose-pt" x="32" y="60">S</text>
            <text class="rose-pt" x="8"  y="36">W</text>
            <g id="geo-needle">
              <polygon class="rose-needle-n" points="32,10 26.5,33 37.5,33"/>
              <polygon class="rose-needle-s" points="32,54 26.5,33 37.5,33"/>
            </g>
          </svg>
          <button class="geo-read" onclick="copyCoords()" title="Your position — tap to copy">
            <span class="geo-coords" id="geo-coords">waiting for GPS…</span>
          </button>
        </div>

        <!-- What a driver picks from after tapping Hazard. Above the dock rather
             than a dialog: it is one tap, at the roadside, often while still
             rolling to a stop. -->
        <div id="hazard-picker" hidden>
          <div class="hz-title">Tell the other drivers</div>
          <div class="hz-row" id="hz-row"></div>
          <button class="hz-cancel" onclick="toggleHazardPicker(false)">Cancel</button>
        </div>
      <div id="turn-banner">
        <div class="turn-arrow" id="turn-arrow">↑</div>
        <div class="turn-info">
          <!-- Names the source, because the stop card below carries two more
               fields that read like directions and neither comes from here. -->
          <div class="turn-source">Live directions</div>
          <div class="turn-dist" id="turn-dist">—</div>
          <div class="turn-text" id="turn-text">Getting directions…</div>
          <div class="turn-next" id="turn-next"></div>
          <!-- What is between here and there: the traffic Google reports, and
               anything a driver has flagged on the road ahead. -->
          <div class="turn-conditions" id="turn-conditions"></div>
        </div>
      </div>
      <!-- The map and the things that float ON it, in one positioned box.
           Without this they were positioned against #view-map, which STARTS at
           the turn banner — so the compass sat on top of the directions the
           moment any were showing, and the zoom slider centred itself on the
           banner as well as the map. -->
      </div>


      <!-- The zoom, as a slider on the edge of the map rather than a pinch.
           Deliberate, one-handed, and it cannot be nudged by accident the way a
           two-finger gesture can — the map's own gesture zoom stays off. -->
      <div id="map-zoom" aria-label="Zoom">
        <button class="zoom-end" onclick="nudgeZoom(1)" aria-label="Zoom in" tabindex="-1">+</button>
        <input id="zoom-slider" type="range" min="12" max="20" step="1" value="18"
               oninput="setZoomFromSlider(this.value)" aria-label="Zoom level"
               orient="vertical">
        <button class="zoom-end" onclick="nudgeZoom(-1)" aria-label="Zoom out" tabindex="-1">−</button>
      </div>
    </div>

    <div id="nav-card" style="display:none;"></div>

    <!-- Round, across the bottom, floating ON the map so they cost it no
         height. The old bar was 166px of the screen; this is a scrim.
         Every one is a 48px circle with its word under it, so nothing has to
         be guessed at from an emoji alone. -->
    <div id="map-dock">
      <button class="dock-btn active" id="mode-follow" onclick="setMapView('driving')" title="Close in, riding with you">
        <span class="dock-ico">🧭</span><span class="dock-cap">Driving</span></button>
      <button class="dock-btn" id="mode-overview" onclick="setMapView('route')" title="Step back to see the rest of the round">
        <span class="dock-ico">🔭</span><span class="dock-cap">Route</span></button>
      <button class="dock-btn" id="mode-live" onclick="toggleRouteOrder()" title="Planned order — tap for the quickest order from here">
        <span class="dock-ico">📋</span><span class="dock-cap" id="order-cap">Plan</span></button>
      <button class="dock-btn" id="mode-sat" onclick="toggleSatellite()" title="Aerial imagery — helps spot driveways and gates">
        <span class="dock-ico">🛰</span><span class="dock-cap">Sat</span></button>
      <button class="dock-btn" id="mode-photo" onclick="photoFromMap()" title="Photograph the stop you are at">
        <span class="dock-ico">📷</span><span class="dock-cap">Photo</span></button>
      <button class="dock-btn" id="mode-gps" onclick="shareLocation()" title="GPS — tap to send your position to dispatch">
        <span class="dock-ico">📍</span><span class="dock-cap" id="gps-cap">GPS</span></button>
      <button class="dock-btn" id="mode-stop" onclick="goToStopInfo()" title="Open this stop's card and its report buttons">
        <span class="dock-ico">🧾</span><span class="dock-cap">Stop</span></button>
      <button class="dock-btn" id="mode-hazard" onclick="toggleHazardPicker()" title="Tell the other drivers about the road">
        <span class="dock-ico">⚠️</span><span class="dock-cap">Hazard</span></button>
      <button class="dock-btn on" id="mode-alert" onclick="cycleAlertMode()" title="Arrival alert">
        <span class="dock-ico">🔔</span><span class="dock-cap">Sound</span></button>
      <!-- Folds the strip away. Stays visible when it is folded, because a
           control that hides itself along with everything else is a control
           nobody gets back. -->
      <button id="dock-toggle" onclick="toggleDock()" aria-expanded="true"
              aria-controls="map-dock" title="Hide the buttons">⌄</button>
    </div>
    <span id="optimize-status"></span>
  </div>
</div>

<div class="action-bar">
  <a href="/" class="btn-secondary">← Routes</a>
  <button class="btn-primary" id="start-day-btn">Start My Day (saves a backup)</button>
  <button class="btn-secondary" id="view-original-btn" style="display:none;">📋 View Original</button>
</div>

<div id="original-overlay">
  <div id="original-panel">
    <div id="original-header">
      <span>Original Route</span>
      <button id="original-close">✕ Close</button>
    </div>
    <div id="original-list"></div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/sim.js"></script>
<script src="/js/report-errors.js"></script>
<script src="/js/fonts.js"></script>
<script src="/js/style-units.js"></script>
<script src="/js/styles.js"></script>
<script src="/js/routes.js"></script>
<script src="/js/driver.js"></script>
<script src="/js/map.js"></script>
<script src="/js/report.js"></script>
<script src="/js/camera.js"></script>
</body>
</html>
