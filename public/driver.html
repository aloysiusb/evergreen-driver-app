<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route — Evergreen Compost</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>

<header class="route-header">
  <div class="route-header-top">
    <a href="/" class="home-btn" title="All Routes">⌂</a>
    <div>
      <div class="route-title" id="route-name">Loading…</div>
      <div class="route-day" id="route-day"></div>
    </div>
    <div class="route-date" id="route-date"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="progress-text" id="progress-text">Loading route…</div>
  <div class="view-tabs">
    <button class="view-tab active" id="tab-stops" onclick="switchView('stops')">Stops</button>
    <button class="view-tab" id="tab-map" onclick="switchView('map')">🗺 Map</button>
  </div>
</header>

<div id="ws-status">⚠ Reconnecting — changes may not sync live</div>
<div id="pending-status" style="display:none;"></div>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading route…</div>
</div>

<div id="main-content" style="display:none;">
  <div class="content" id="view-stops">
    <div id="stops-list"></div>
  </div>
  <div id="view-map" style="display:none;">
    <div id="map-optimize-bar">
      <div class="route-mode-toggle">
        <button class="mode-btn active" id="mode-planned" onclick="setRouteMode('planned')">📋 Planned</button>
        <button class="mode-btn" id="mode-live" onclick="setRouteMode('live')">⚡ Live</button>
        <button class="mode-btn active" id="mode-follow" onclick="toggleFollow()" title="Following you — tap to stop">🧭 Follow</button>
        <button class="mode-btn" id="mode-sat" onclick="toggleSatellite()">🛰 Satellite</button>
        <button class="mode-btn active" id="mode-alert" onclick="cycleAlertMode()">🔔 Sound</button>
      </div>
      <span id="optimize-status"></span>
    </div>
    <div id="turn-banner">
      <div class="turn-arrow" id="turn-arrow">↑</div>
      <div class="turn-info">
        <div class="turn-dist" id="turn-dist">—</div>
        <div class="turn-text" id="turn-text">Getting directions…</div>
        <div class="turn-next" id="turn-next"></div>
      </div>
    </div>
    <div id="route-map"></div>
    <div id="map-loading">Loading map…</div>
    <div id="nav-card" style="display:none;"></div>
  </div>
</div>

<div class="action-bar">
  <a href="/" class="btn-secondary">← Routes</a>
  <button class="btn-primary" id="start-day-btn">Start My Day (saves a backup)</button>
  <button class="btn-secondary" id="view-original-btn" style="display:none;">📋 View Original</button>
</div>

<div id="original-overlay">
  <div id="original-panel">
    <div id="original-header">
      <span>Original Route</span>
      <button id="original-close">✕ Close</button>
    </div>
    <div id="original-list"></div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/sim.js"></script>
<script src="/js/report-errors.js"></script>
<script src="/js/fonts.js"></script>
<script src="/js/style-units.js"></script>
<script src="/js/styles.js"></script>
<script src="/js/routes.js"></script>
<script src="/js/driver.js"></script>
<script src="/js/map.js"></script>
<script src="/js/report.js"></script>
<script src="/js/camera.js"></script>
</body>
</html>
