<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route — Evergreen Compost</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/chrome.css">
<!-- map-ui.css first: app.css overrides two of its rules for this page, where
     the map fills the screen rather than sitting inside one. -->
<link rel="stylesheet" href="/css/map-ui.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<header class="app-bar">
  <h1><span class="app-mark"></span><span class="app-name"></span> <span class="app-page">Route</span></h1>
  <nav><a href="/">Routes</a><a href="/dispatch">Dispatch</a></nav>
</header>


<!-- One line instead of four stacked blocks. This header was 182px tall on a
     phone — with the app bar above it, 221px, a quarter of the screen, before
     the map got a single pixel. Everything that was stacked is now on the same
     row: who you are, where you are up to, and the two views. The progress bar
     stays as a hairline under it, because a bar you can read at a glance is
     worth 3px. -->
<header class="route-header">
  <div class="route-line">
    <button class="hdr-menu" id="hdr-menu" onclick="toggleHeaderMenu()"
            aria-label="Menu" aria-expanded="false" aria-controls="hdr-drawer">☰</button>
    <div class="route-ident">
      <span class="route-title" id="route-name">Loading…</span>
      <span class="route-meta"><span id="route-day"></span><span id="route-date"></span></span>
    </div>
    <span class="progress-text" id="progress-text">Loading…</span>
    <!-- Smaller than they were, still the most obvious thing on the line. -->
    <div class="view-tabs">
      <button class="view-tab" id="tab-stops" onclick="switchView('stops')">Stops</button>
      <button class="view-tab active" id="tab-map" onclick="switchView('map')">Map</button>
    </div>
    <!-- The map's controls, on the header rather than on the map. They were a
         button in the corner of the map itself, which is a piece of road; up
         here they cost the map nothing at all and sit where the page's other
         controls are. Shut it is a hamburger; open it drops a list below. -->
    <div id="map-dock" data-default-folded="1">
      <!-- The rows live in their own box so the button can stay in the
           header when the list drops out of it. Without this the whole
           dock left the flow on opening and the Stops / Map tabs shuffled
           sideways every time. -->
      <div class="dock-list">
      <button class="dock-btn active" id="mode-follow" onclick="setMapView('driving')" title="Close in, riding with you">
        <span class="dock-ico">🧭</span><span class="dock-cap">Driving</span></button>
      <button class="dock-btn" id="mode-overview" onclick="setMapView('route')" title="Step back to see the rest of the round">
        <span class="dock-ico">🔭</span><span class="dock-cap">Whole round</span></button>
      <button class="dock-btn" id="mode-directions" onclick="toggleDirections()" title="Turn-by-turn and traffic — off by default, because it is a lot of text over the map">
        <span class="dock-ico">🧾</span><span class="dock-cap">Directions</span></button>
      <button class="dock-btn" id="mode-reset" onclick="resetMapView()" title="Put the map back to its usual view">
        <span class="dock-ico">⟳</span><span class="dock-cap">Default</span></button>
      <button class="dock-btn" id="mode-live" onclick="toggleRouteOrder()" title="Planned order — tap for the quickest order from here">
        <span class="dock-ico">📋</span><span class="dock-cap" id="order-cap">Sheet order</span></button>
      <button class="dock-btn" id="mode-sat" onclick="toggleSatellite()" title="Aerial imagery — helps spot driveways and gates">
        <span class="dock-ico">🛰</span><span class="dock-cap">Satellite</span></button>
      <button class="dock-btn" id="mode-photo" onclick="photoFromMap()" title="Photograph the stop you are at">
        <span class="dock-ico">📷</span><span class="dock-cap">Take a photo</span></button>
      <button class="dock-btn" id="mode-gps" onclick="toggleLiveShare()" title="Tap to let dispatch see where you are">
        <span class="dock-ico">📍</span><span class="dock-cap" id="gps-cap">Share my position</span></button>
      <button class="dock-btn" id="mode-stop" onclick="goToStopInfo()" title="Open this stop's card and its report buttons">
        <span class="dock-ico">🧾</span><span class="dock-cap">This stop</span></button>
      <button class="dock-btn" id="mode-hazard" onclick="toggleHazardPicker()" title="Tell the other drivers about the road">
        <span class="dock-ico">⚠️</span><span class="dock-cap">Report a hazard</span></button>
      <button class="dock-btn on" id="mode-alert" onclick="cycleAlertMode()" title="Arrival alert">
        <span class="dock-ico">🔔</span><span class="dock-cap">Arrival sound</span></button>
      </div>
      <!-- Folds the strip away. Stays visible when it is folded, because a
           control that hides itself along with everything else is a control
           nobody gets back. -->
      <!-- The label is written by map-dock.js, because it says different
           things open and shut and the two must never disagree. -->
      <button id="dock-toggle" onclick="toggleDock()" aria-expanded="true"
              aria-controls="map-dock" title="Hide the buttons"></button>
      </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <!-- On a phone the links and the date live in here instead of on the line.
       Stops / Map never does: it is the control, not a detail. -->
  <div class="hdr-drawer" id="hdr-drawer" hidden>
    <a href="/">⌂ All routes</a>
    <a href="/dispatch">📡 Dispatcher board</a>
    <!-- These were a bar pinned across the foot of every screen, 89px of
         chrome under the map for two things a driver touches once a day and
         once a week. Same buttons, same handlers — in the menu they are a tap
         away instead of permanently in the way. -->
    <button class="hdr-drawer-btn" id="start-day-btn">🗓 Start my day <span class="hdr-drawer-sub">saves a backup</span></button>
    <button class="hdr-drawer-btn" id="view-original-btn" style="display:none;">📋 View the original route</button>
    <span class="hdr-drawer-meta" id="drawer-meta"></span>
  </div>
</header>

<div id="ws-status">⚠ Reconnecting — changes may not sync live</div>
<div id="pending-status" style="display:none;"></div>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading route…</div>
</div>

<div id="main-content" style="display:none;">
  <div class="content" id="view-stops">
    <div id="stops-list"></div>
  </div>
  <div id="view-map" style="display:none;">
    <div id="map-wrap">
      <div id="route-map"></div>
      <div id="map-loading">Loading map…</div>
      <!-- The head-up display: where you are, which way you are pointing, and
           what is between here and the stop. Anchored over the map rather than
           stacked above it, so it costs the map no height and a driver reads it
           without looking away from the road. Transparent, on a scrim dark
           enough to carry white text over a pale road map as well as satellite.

           Nothing here reaches the bottom of the screen, so the report buttons
           down there are untouched. -->
      <div id="map-hud">
        <!-- Where you are and which way you are pointing, on the map itself.
             Top centre because Google owns both top corners (map type on the left,
             fullscreen on the right) and both bottom ones. Tap copies the
             coordinates, which is what you want when you are reading them to
             somebody over the radio. -->
        <div id="geo-chip">
          <!-- A real compass rose, not a letter. The rim is fixed with north at the
               top, and the needle turns — so "needle pointing up" means driving
               north, which is readable in the half-second a driver can spare.
               Translucent on purpose: it overlaps the map and is meant to. -->
          <svg class="geo-rose" viewBox="0 0 64 64" role="button" tabindex="0"
               onclick="showCoords()" aria-label="Show and copy your coordinates">
            <circle class="rose-ring" cx="32" cy="32" r="29"/>
            <circle class="rose-hub" cx="32" cy="32" r="2.5"/>
            <text class="rose-pt rose-n" x="32" y="13">N</text>
            <text class="rose-pt" x="56" y="36">E</text>
            <text class="rose-pt" x="32" y="60">S</text>
            <text class="rose-pt" x="8"  y="36">W</text>
            <g id="geo-needle">
              <polygon class="rose-needle-n" points="32,10 26.5,33 37.5,33"/>
              <polygon class="rose-needle-s" points="32,54 26.5,33 37.5,33"/>
            </g>
          </svg>
          <!-- Shown outright when the screen has room for it, and on a tap on
               the rose when it has not. A phone has not. -->
          <button class="geo-read" onclick="copyCoords()" title="Your position — tap to copy">
            <span class="geo-coords" id="geo-coords">waiting for GPS…</span>
          </button>
        </div>

      <!-- The route time and the traffic, on the compass's line. This used to
           float above the dock at the foot of the map, which put the one
           readout a driver glances at furthest from everything else they
           glance at. -->
      <!-- On while dispatch can see the truck, and only then. A driver should
           never have to remember whether they left it on, or go looking for a
           button to find out. -->
      <span id="live-chip" hidden>● Dispatch can see you</span>
      <span id="optimize-status"></span>
      <div id="turn-banner">
        <div class="turn-arrow" id="turn-arrow">↑</div>
        <div class="turn-info">
          <!-- Names the source, because the stop card below carries two more
               fields that read like directions and neither comes from here. -->
          <div class="turn-source">Live directions</div>
          <div class="turn-dist" id="turn-dist">—</div>
          <div class="turn-text" id="turn-text">Getting directions…</div>
          <div class="turn-next" id="turn-next"></div>
          <!-- What is between here and there: the traffic Google reports, and
               anything a driver has flagged on the road ahead. -->
          <div class="turn-conditions" id="turn-conditions"></div>
        </div>
      </div>
      <!-- The map and the things that float ON it, in one positioned box.
           Without this they were positioned against #view-map, which STARTS at
           the turn banner — so the compass sat on top of the directions the
           moment any were showing, and the zoom slider centred itself on the
           banner as well as the map. -->
      </div>


      <!-- Hand off to Google Maps, Waze or Apple Maps. It used to be built
           inside the stop card below the map, which is why it opened down at
           the foot of the page, level with the report buttons. It lives on the
           map now, on the compass's line: a driver taps Navigate and the
           choice appears where they are already looking, over the map rather
           than under it. It closes on a choice, on Cancel, or on a tap
           anywhere else. -->
      <div id="nav-app-picker" hidden>
        <button class="nav-app-btn" onclick="navOpenIn('google')">
          🗺 Google Maps<span class="nav-app-sub" id="nav-handoff-count"></span></button>
        <button class="nav-app-btn" onclick="navOpenIn('waze')">🚦 Waze</button>
        <button class="nav-app-btn" onclick="navOpenIn('apple')">🍎 Apple Maps</button>
        <button class="nav-app-close" onclick="closeNavPicker()" aria-label="Close">✕</button>
      </div>

      <!-- What other drivers have reported on the road, across the top of the
           map. Two lines of it, because two is what you can take in at a
           glance and the rest is reference — anything past that is behind
           "more". Empty and gone when nobody has reported anything, which is
           most days. -->
      <div id="hazard-strip" hidden>
        <button class="hz-strip-hide" id="hz-strip-hide" onclick="hideHazardNote()"
                aria-label="Hide road reports" title="Hide road reports">−</button>
        <div class="hz-strip-row" id="hz-strip-row"></div>
        <button class="hz-strip-more" id="hz-strip-more" hidden onclick="toggleHazardStrip()"></button>
      </div>
      <!-- What is left when a driver puts the note away: the count, so they
           know there is something there, and a way back to it. -->
      <button id="hazard-badge" hidden onclick="showHazardNote()"
              aria-label="Show road reports"></button>

      <!-- Appears only once the map has been dragged off the driver. Bottom
           right of the map: clear of the dock at the top, clear of the zoom
           slider in the middle, and above Google's own Terms link. -->
      <button id="map-recenter" hidden onclick="recenterMap()"
              title="Centre the map back on you"
              aria-label="Centre the map back on you">◎</button>

      <!-- The zoom, as a slider on the edge of the map rather than a pinch.
           Deliberate, one-handed, and it cannot be nudged by accident the way a
           two-finger gesture can — the map's own gesture zoom stays off. -->
      <div id="map-zoom" aria-label="Zoom">
        <button class="zoom-end" onclick="nudgeZoom(1)" aria-label="Zoom in" tabindex="-1">+</button>
        <input id="zoom-slider" type="range" min="12" max="20" step="1" value="16"
               oninput="setZoomFromSlider(this.value)" aria-label="Zoom level"
               orient="vertical">
        <button class="zoom-end" onclick="nudgeZoom(-1)" aria-label="Zoom out" tabindex="-1">−</button>
      </div>

      <!-- What a driver picks from after tapping Hazard. Not a dialog: it is
           one tap, at the roadside, often while still rolling to a stop. It
           hangs under the dock, wherever the dock is. -->
      <div id="hazard-picker" hidden>
      <div class="hz-title">Tell the other drivers</div>
      <div class="hz-row" id="hz-row"></div>
      <button class="hz-cancel" onclick="toggleHazardPicker(false)">Cancel</button>
      </div>

    </div>

    <!-- The stop you are at: its name, its access note, and the stop's OWN
         round buttons — contamination, bear, overflow, skip. Below the map,
         which is where they stay: they belong to the stop, not to the map. -->
    <div id="nav-card" style="display:none;"></div>
  </div>
</div>

<div id="original-overlay">
  <div id="original-panel">
    <div id="original-header">
      <span>Original Route</span>
      <button id="original-close">✕ Close</button>
    </div>
    <div id="original-list"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* Debug overlay — ONLY when the URL carries ?debug=1, so a driver never sees it.
 *
 * Here because the map fails on this page with Google's generic "This page
 * can't load Google Maps correctly" and the real reason is only ever printed
 * to the browser console. The owner works from an iPad, where there is no
 * console to open, so the error was unreachable. Every external check of the
 * key passed — referrer, billing, map creation, API restrictions — which means
 * the answer is only visible from inside this page.
 *
 * Installed before every other script so nothing can fail ahead of it. */
(function(){
  if (new URLSearchParams(location.search).get('debug') !== '1') return;
  var lines = [];
  function show(){
    var el = document.getElementById('__dbg');
    if (!el) {
      el = document.createElement('div');
      el.id = '__dbg';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999999;'
        + 'max-height:55vh;overflow:auto;background:#111;color:#0f0;'
        + 'font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px 12px;'
        + '-webkit-user-select:text;user-select:text;white-space:pre-wrap;'
        + 'word-break:break-word;border-top:2px solid #0f0';
      document.body.appendChild(el);
    }
    el.textContent = 'DEBUG — tap and hold to select, then copy\n\n' + lines.join('\n\n');
  }
  function add(tag, msg){ lines.push('[' + tag + '] ' + msg); if (document.body) show(); }

  var ce = console.error, cw = console.warn;
  console.error = function(){ add('error', [].slice.call(arguments).join(' ')); ce.apply(console, arguments); };
  console.warn  = function(){ add('warn',  [].slice.call(arguments).join(' ')); cw.apply(console, arguments); };
  window.addEventListener('error', function(e){
    add('uncaught', (e.message||'') + ' @ ' + (e.filename||'') + ':' + (e.lineno||''));
  });
  /* Google calls this on any key/billing/referrer rejection. It is the single
     most useful signal, and it never reaches the user otherwise. */
  window.gm_authFailure = function(){ add('GOOGLE AUTH', 'gm_authFailure fired — key, referrer, billing or API restriction rejected'); };

  add('page', location.href);
  add('referrer-policy', document.referrerPolicy || '(default)');
  document.addEventListener('DOMContentLoaded', show);
  /* What the page was actually handed as a key, and what it asked for. */
  var f = window.fetch;
  window.fetch = function(u){
    if (String(u).indexOf('maps-key') > -1) {
      return f.apply(this, arguments).then(function(r){
        var c = r.clone();
        c.text().then(function(t){
          add('maps-key ' + r.status, t.replace(/"key":"[^"]{0,8}/, '"key":"…').slice(0, 200));
        }).catch(function(){});
        return r;
      });
    }
    return f.apply(this, arguments);
  };
})();
</script>
<script src="/js/sim.js"></script>
<script src="/js/report-errors.js"></script>
<script src="/js/fonts.js"></script>
<script src="/js/style-units.js"></script>
<script src="/js/styles.js"></script>
<script src="/js/routes.js"></script>
<script src="/js/access-failure.js"></script>
<script src="/js/driver.js"></script>
<script src="/js/map-dock.js"></script>
<script src="/js/map.js"></script>
<script src="/js/report.js"></script>
<script src="/js/camera.js"></script>
</body>
</html>
