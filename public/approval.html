<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evergreen Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/chrome.css">
<style>
  :root {
    --bg:        #f4f7f3;
    --surface:   #ffffff;
    --border:    #dae5d7;
    --text:      #1a2e18;
    --muted:     #556b52;
    --header:    #1b4332;
    --header-lt: #2d6a4f;
    --green:     #16a34a;
    --green-lt:  #dcfce7;
    --green-tx:  #14532d;
    --amber:     #d97706;
    --amber-lt:  #fef3c7;
    --amber-tx:  #78350f;
    --red:       #dc2626;
    --red-lt:    #fee2e2;
    --red-tx:    #7f1d1d;
    --blue:      #2563eb;
    --blue-lt:   #dbeafe;
    --blue-tx:   #1e3a8a;
    --nav-h:     56px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0f1a0e;
      --surface:   #182416;
      --border:    #2a3d27;
      --text:      #e2eedf;
      --muted:     #7aaa73;
      --header:    #0d2818;
      --header-lt: #1a4a30;
      --green:     #4ade80;
      --green-lt:  #14532d;
      --green-tx:  #bbf7d0;
      --amber:     #fbbf24;
      --amber-lt:  #451a03;
      --amber-tx:  #fde68a;
      --red:       #f87171;
      --red-lt:    #450a0a;
      --red-tx:    #fca5a5;
      --blue:      #60a5fa;
      --blue-lt:   #1e3a5f;
      --blue-tx:   #bfdbfe;
    }
  }

  :root[data-theme="dark"] {
    --bg:        #0f1a0e;
    --surface:   #182416;
    --border:    #2a3d27;
    --text:      #e2eedf;
    --muted:     #7aaa73;
    --header:    #0d2818;
    --header-lt: #1a4a30;
    --green:     #4ade80;
    --green-lt:  #14532d;
    --green-tx:  #bbf7d0;
    --amber:     #fbbf24;
    --amber-lt:  #451a03;
    --amber-tx:  #fde68a;
    --red:       #f87171;
    --red-lt:    #450a0a;
    --red-tx:    #fca5a5;
    --blue:      #60a5fa;
    --blue-lt:   #1e3a5f;
    --blue-tx:   #bfdbfe;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top nav ── */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header);
    height: var(--nav-h);
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 20px;
    border-bottom: 1px solid var(--header-lt);
  }

  .nav-brand {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
    margin-right: 24px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-brand-icon {
    width: 26px;
    height: 26px;
    background: rgba(255,255,255,0.15);
    border-radius: var(--r-control);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .nav-links {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    flex: 1;
  }

  .nav-links::-webkit-scrollbar { display: none; }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--r-control);
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
    border: none;
    background: none;
    cursor: pointer;
  }

  .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .nav-link.active { background: rgba(255,255,255,0.18); color: #fff; }

  /* ── Page header ── */
  .page-header {
    background: var(--header);
    padding: 20px 24px 24px;
    color: #fff;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* ── Summary strip ── */
  .summary {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .summary-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    border-radius: var(--r-card);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
  }

  .chip-count {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .chip-label { opacity: 0.8; }

  /* ── Filter bar ── */
  .filter-bar {
    padding: 14px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: var(--r-sheet);
    border: 1.5px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--green); color: var(--green); }
  .filter-btn.active { background: var(--green); border-color: var(--green); color: #fff; }

  /* ── Request list ── */
  .list {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 860px;
  }

  .request-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-panel);
    overflow: hidden;
    transition: box-shadow 0.15s;
  }

  .request-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

  .request-card.resolved { opacity: 0.55; }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px 12px;
  }

  .type-badge {
    padding: 4px 10px;
    border-radius: var(--r-control);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .badge-hold    { background: var(--blue-lt);  color: var(--blue-tx); }
  .badge-missed  { background: var(--amber-lt); color: var(--amber-tx); }
  .badge-update  { background: var(--blue-lt);  color: var(--blue-tx); }
  .badge-payment { background: var(--green-lt); color: var(--green-tx); }

  .card-info { flex: 1; min-width: 0; }

  .card-customer {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .card-detail {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .status-pill {
    padding: 4px 10px;
    border-radius: var(--r-sheet);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .pill-pending  { background: var(--amber-lt); color: var(--amber-tx); }
  .pill-approved { background: var(--green-lt); color: var(--green-tx); }
  .pill-declined { background: var(--red-lt);   color: var(--red-tx); }

  .card-actions {
    display: flex;
    gap: 8px;
    padding: 0 18px 14px;
  }

  .btn-approve, .btn-decline, .btn-send {
    padding: 7px 16px;
    border-radius: var(--r-card);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }

  .btn-approve { background: var(--green);  color: #fff; }
  .btn-decline { background: var(--red-lt); color: var(--red-tx); }
  .btn-send    { background: var(--blue-lt); color: var(--blue-tx); }

  .btn-approve:hover, .btn-decline:hover, .btn-send:hover { opacity: 0.8; }

  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 15px;
  }

  /* ── Demo links section ── */





  @media (max-width: 600px) {
    .list { padding-left: 14px; padding-right: 14px; margin-left: 0; margin-right: 0; }
    .filter-bar { padding: 12px 14px; }
    .page-header { padding: 16px 14px 20px; }
    .topnav { padding: 0 14px; }
  }
  .tab-pick {
    font: inherit; font-size: 13px; padding: 7px 10px; margin-right: 8px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
  }
</style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <div class="nav-brand">
    <div class="nav-brand-icon">🌿</div>
    Evergreen
  </div>
  <div class="nav-links">
    <a class="nav-link active" href="#">Requests</a>
    <a class="nav-link" href="/portal.html" target="_blank">Customer Portal</a>
    <a class="nav-link" href="/pitch.html" target="_blank">Presentation</a>
    <a class="nav-link" href="/iphone.html" target="_blank">iPhone Preview</a>
    <a class="nav-link" href="https://evergreen-driver-app.onrender.com" target="_blank">Driver App ↗</a>
    <a class="nav-link" href="https://evergreen-driver-app.onrender.com/admin.html" target="_blank">Style Editor ↗</a>
  </div>
</nav>

<!-- PAGE HEADER -->
<header class="app-bar">
  <h1><span class="app-mark"></span><span class="app-name"></span> <span class="app-page">Request queue</span></h1>
  <nav><a href="/">Routes</a><a href="/dispatch">Dispatch</a></nav>
</header>

<div class="page-header">
  <div class="page-title">Customer Requests</div>
  <div class="summary">
    <div class="summary-chip">
      <span class="chip-count" id="count-pending">4</span>
      <span class="chip-label">Pending</span>
    </div>
    <div class="summary-chip">
      <span class="chip-count" id="count-today">6</span>
      <span class="chip-label">Today</span>
    </div>
    <div class="summary-chip">
      <span class="chip-count" id="count-approved">2</span>
      <span class="chip-label">Approved</span>
    </div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
  <button class="filter-btn" onclick="setFilter('hold', this)">Holds</button>
  <button class="filter-btn" onclick="setFilter('missed', this)">Missed Pickups</button>
  <button class="filter-btn" onclick="setFilter('update', this)">Account Updates</button>
  <button class="filter-btn" onclick="setFilter('new_customer', this)">New customers</button>
</div>

<!-- REQUEST LIST -->
<div class="list" id="request-list"></div>

<!-- The "all demo pages" block that used to sit here — pitch deck, iPhone
     preview, style editor — belonged to this page when it was a mockup being
     shown to people. It is now the screen Alyssa works out of every day, and
     a sales reel in the middle of an inbox is just noise. Those pages are all
     linked from hub.html, which is where browsing belongs.
     Removed 2026-09-18. -->
<!-- DEMO LINKS REMOVED -->

<script>
  /* Live data. This page used to hold 22 hardcoded rows and flip a local
     variable when you pressed Approve — nothing was stored and nothing
     reached the office. It now reads the real queue and the buttons really
     decide. */

  let REQUESTS = [];
  let ROUTE_TABS = [];
  let currentFilter = 'all';
  let busy = new Set();

  const KIND_BADGE = {
    new_customer: 'badge-update', hold: 'badge-hold',
    missed: 'badge-missed', update: 'badge-update',
  };
  const KIND_LABEL = {
    new_customer: 'New customer', hold: 'Service hold',
    missed: 'Missed pickup', update: 'Account update',
  };

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pillClass(s) {
    return { pending:'pill-pending', approved:'pill-approved', declined:'pill-declined' }[s] || '';
  }
  function pillLabel(s) {
    return { pending:'Pending', approved:'Approved', declined:'Declined' }[s] || s;
  }

  function whenText(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const today = new Date().toDateString() === d.toDateString();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return (today ? 'Today ' : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ') + time;
  }

  /* What the card says under the name. Requests carry a free-text detail from
     the portal; a new customer has an address instead. */
  function detailText(r) {
    if (r.detail) return r.detail;
    const addr = [r.address, r.city].filter(Boolean).join(', ');
    return addr || r.notes || '';
  }

  async function load() {
    try {
      const [reqRes, tabRes] = await Promise.all([
        fetch('/api/requests'),
        fetch('/api/tabs').catch(() => null),
      ]);
      if (!reqRes.ok) throw new Error('HTTP ' + reqRes.status);
      const data = await reqRes.json();
      REQUESTS = data.items || [];
      if (tabRes && tabRes.ok) ROUTE_TABS = (await tabRes.json()).tabs || [];
      render();
    } catch (err) {
      document.getElementById('request-list').innerHTML =
        '<div class="empty">Could not load requests.<br><small>' + esc(err.message) + '</small></div>';
    }
  }

  function actionsHtml(r) {
    if (r.status !== 'pending') return '';
    if (busy.has(r.id)) return '<div class="card-actions"><em>Saving…</em></div>';

    // Only a new customer needs somewhere to go. Everything else is just
    // "handled" — approving a hold should not add anyone to a route.
    const picker = r.kind === 'new_customer'
      ? '<select id="tab-' + esc(r.id) + '" class="tab-pick">' +
          '<option value="">Which route?</option>' +
          ROUTE_TABS.map(t => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join('') +
        '</select>'
      : '';

    return '<div class="card-actions">' + picker +
      '<button class="btn-approve" onclick="doApprove(\'' + esc(r.id) + '\')">Approve</button>' +
      '<button class="btn-decline" onclick="doDecline(\'' + esc(r.id) + '\')">Decline</button>' +
      '</div>';
  }

  function render() {
    const list = document.getElementById('request-list');
    const filtered = REQUESTS.filter(r => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'pending') return r.status === 'pending';
      return r.kind === currentFilter;
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">No requests to show.</div>';
      updateCounts();
      return;
    }

    list.innerHTML = filtered.map(r => {
      const contact = [r.email, r.phone].filter(Boolean).join(' · ');
      return '<div class="request-card ' + (r.status !== 'pending' ? 'resolved' : '') + '" id="card-' + esc(r.id) + '">' +
        '<div class="card-top">' +
          '<span class="type-badge ' + (KIND_BADGE[r.kind] || '') + '">' + esc(KIND_LABEL[r.kind] || r.kind) + '</span>' +
          '<div class="card-info">' +
            '<div class="card-customer">' + esc(r.name) + '</div>' +
            '<div class="card-detail">' + esc(detailText(r)) + '</div>' +
            '<div class="card-meta">' + esc(contact) + (contact ? ' · ' : '') + esc(whenText(r.created_at)) +
              (r.decided_tab ? ' · added to ' + esc(r.decided_tab) : '') + '</div>' +
          '</div>' +
          '<span class="status-pill ' + pillClass(r.status) + '">' + pillLabel(r.status) + '</span>' +
        '</div>' +
        actionsHtml(r) +
      '</div>';
    }).join('');

    updateCounts();
  }

  function updateCounts() {
    const pending  = REQUESTS.filter(r => r.status === 'pending').length;
    const approved = REQUESTS.filter(r => r.status === 'approved').length;
    const pEl = document.getElementById('count-pending');
    const aEl = document.getElementById('count-approved');
    if (pEl) pEl.textContent = pending;
    if (aEl) aEl.textContent = approved;
  }

  async function decide(id, action, body) {
    busy.add(id); render();
    try {
      const res = await fetch('/api/requests/' + encodeURIComponent(id) + '/' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      const i = REQUESTS.findIndex(r => r.id === id);
      if (i >= 0 && data.id) REQUESTS[i] = data;
    } catch (err) {
      alert(err.message);
    } finally {
      busy.delete(id); render();
    }
  }

  window.doApprove = function (id) {
    const r = REQUESTS.find(x => x.id === id);
    let tabName = '';
    if (r && r.kind === 'new_customer') {
      const sel = document.getElementById('tab-' + id);
      tabName = sel ? sel.value : '';
      if (!tabName) { alert('Pick which route they go on first.'); return; }
    }
    decide(id, 'approve', tabName ? { tabName } : {});
  };

  window.doDecline = function (id) { decide(id, 'decline'); };

  window.setFilter = function (f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };

  // The server already broadcasts these, so a request submitted from the
  // portal shows up here without a refresh.
  (function live() {
    try {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto + '//' + location.host + '/ws');
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'request-created' || msg.type === 'request-decided') load();
      };
      ws.onclose = () => setTimeout(live, 5000);
      ws.onerror = () => console.warn('[approval] live updates dropped; will retry');
    } catch (err) {
      // Without this the queue silently stops updating itself and the only
      // symptom is requests appearing late, which looks like the portal is
      // broken rather than the socket.
      console.warn('[approval] live updates unavailable:', err.message);
    }
  })();

  load();
</script>

</body></html>
