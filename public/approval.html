<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evergreen Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/chrome.css">
<style>
  :root {
    --bg:        #f4f7f3;
    --surface:   #ffffff;
    --border:    #dae5d7;
    --text:      #1a2e18;
    --muted:     #556b52;
    --header:    #1b4332;
    --header-lt: #2d6a4f;
    --green:     #16a34a;
    --green-lt:  #dcfce7;
    --green-tx:  #14532d;
    --amber:     #d97706;
    --amber-lt:  #fef3c7;
    --amber-tx:  #78350f;
    --red:       #dc2626;
    --red-lt:    #fee2e2;
    --red-tx:    #7f1d1d;
    --blue:      #2563eb;
    --blue-lt:   #dbeafe;
    --blue-tx:   #1e3a8a;
    --nav-h:     56px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0f1a0e;
      --surface:   #182416;
      --border:    #2a3d27;
      --text:      #e2eedf;
      --muted:     #7aaa73;
      --header:    #0d2818;
      --header-lt: #1a4a30;
      --green:     #4ade80;
      --green-lt:  #14532d;
      --green-tx:  #bbf7d0;
      --amber:     #fbbf24;
      --amber-lt:  #451a03;
      --amber-tx:  #fde68a;
      --red:       #f87171;
      --red-lt:    #450a0a;
      --red-tx:    #fca5a5;
      --blue:      #60a5fa;
      --blue-lt:   #1e3a5f;
      --blue-tx:   #bfdbfe;
    }
  }

  :root[data-theme="dark"] {
    --bg:        #0f1a0e;
    --surface:   #182416;
    --border:    #2a3d27;
    --text:      #e2eedf;
    --muted:     #7aaa73;
    --header:    #0d2818;
    --header-lt: #1a4a30;
    --green:     #4ade80;
    --green-lt:  #14532d;
    --green-tx:  #bbf7d0;
    --amber:     #fbbf24;
    --amber-lt:  #451a03;
    --amber-tx:  #fde68a;
    --red:       #f87171;
    --red-lt:    #450a0a;
    --red-tx:    #fca5a5;
    --blue:      #60a5fa;
    --blue-lt:   #1e3a5f;
    --blue-tx:   #bfdbfe;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top nav ── */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header);
    height: var(--nav-h);
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 20px;
    border-bottom: 1px solid var(--header-lt);
  }

  .nav-brand {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
    margin-right: 24px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-brand-icon {
    width: 26px;
    height: 26px;
    background: rgba(255,255,255,0.15);
    border-radius: var(--r-control);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .nav-links {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    flex: 1;
  }

  .nav-links::-webkit-scrollbar { display: none; }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--r-control);
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
    border: none;
    background: none;
    cursor: pointer;
  }

  .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .nav-link.active { background: rgba(255,255,255,0.18); color: #fff; }

  /* ── Page header ── */
  .page-header {
    background: var(--header);
    padding: 20px 24px 24px;
    color: #fff;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* ── Summary strip ── */
  .summary {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .summary-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    border-radius: var(--r-card);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
  }

  .chip-count {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .chip-label { opacity: 0.8; }

  /* ── Filter bar ── */
  .filter-bar {
    padding: 14px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: var(--r-sheet);
    border: 1.5px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--green); color: var(--green); }
  .filter-btn.active { background: var(--green); border-color: var(--green); color: #fff; }

  /* ── Request list ── */
  .list {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 860px;
  }

  .request-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-panel);
    overflow: hidden;
    transition: box-shadow 0.15s;
  }

  .request-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

  .request-card.resolved { opacity: 0.55; }

  .digest-bar {
    margin: 0 0 18px;
    padding: 14px 16px;
    background: var(--surface2, #f6f7f5);
    border: 1px solid var(--border, #e2e5e0);
    border-radius: var(--r-control, 10px);
  }
  .digest-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }
  .digest-toggle, .digest-hour {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .digest-hour select { font: inherit; padding: 2px 4px; }
  .digest-to { font-size: 13px; color: var(--muted); }
  .digest-spacer { flex: 1 1 auto; }
  .digest-preview {
    margin: 12px 0 0;
    padding: 12px;
    background: var(--surface, #fff);
    border: 1px solid var(--border, #e2e5e0);
    border-radius: var(--r-control, 10px);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .digest-status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  /* The bar wraps to two rows on a phone rather than pushing the buttons off
     the edge — this page gets opened on one. */
  @media (max-width: 560px) {
    .digest-spacer { flex-basis: 100%; }
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px 12px;
  }

  .type-badge {
    padding: 4px 10px;
    border-radius: var(--r-control);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .badge-hold    { background: var(--blue-lt);  color: var(--blue-tx); }
  .badge-missed  { background: var(--amber-lt); color: var(--amber-tx); }
  .badge-update  { background: var(--blue-lt);  color: var(--blue-tx); }
  .badge-payment { background: var(--green-lt); color: var(--green-tx); }

  .card-info { flex: 1; min-width: 0; }

  .card-customer {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .card-address {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-detail {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .status-pill {
    padding: 4px 10px;
    border-radius: var(--r-sheet);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .pill-pending  { background: var(--amber-lt); color: var(--amber-tx); }
  .pill-approved { background: var(--green-lt); color: var(--green-tx); }
  .pill-declined { background: var(--red-lt);   color: var(--red-tx); }

  .card-actions {
    display: flex;
    gap: 8px;
    padding: 0 18px 14px;
  }

  .btn-approve, .btn-decline, .btn-send {
    padding: 7px 16px;
    border-radius: var(--r-card);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }

  .btn-approve { background: var(--green);  color: #fff; }
  .btn-decline { background: var(--red-lt); color: var(--red-tx); }
  .btn-send    { background: var(--blue-lt); color: var(--blue-tx); }

  .btn-approve:hover, .btn-decline:hover, .btn-send:hover { opacity: 0.8; }

  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 15px;
  }

  /* ── Demo links section ── */





  @media (max-width: 600px) {
    .list { padding-left: 14px; padding-right: 14px; margin-left: 0; margin-right: 0; }
    .filter-bar { padding: 12px 14px; }
    .page-header { padding: 16px 14px 20px; }
    .topnav { padding: 0 14px; }
  }
  .tab-pick {
    font: inherit; font-size: 13px; padding: 7px 10px; margin-right: 8px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
  }

  /* Price sits beside the route picker because the two are one decision:
     which day they are served, and what they pay for it. */
  .amount-pick {
    font: inherit; font-size: 13px; width: 112px; padding: 7px 10px; margin-right: 8px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
  }

  /* What QuickBooks did, once it has done it. */
  .qbo-line {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .qbo-tag {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    padding: 3px 8px; border-radius: var(--r-chip, 5px);
    background: var(--green-lt); color: var(--green-dk);
  }
  .qbo-tag.failed { background: #fef2f2; color: #991b1b; }
  .qbo-link { font-weight: 600; color: var(--green-dk); word-break: break-all; }
  .qbo-copy {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    padding: 6px 11px; border-radius: var(--r-control);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .qbo-copy:hover { border-color: var(--green); color: var(--green); }
</style>

<!-- PAGE HEADER -->

  <nav><a href="/">Routes</a><a href="/dispatch">Dispatch</a></nav>

<div class="page-header">

  <div class="summary">

      <span class="chip-count" id="count-pending">4</span>

    </div>

      <span class="chip-count" id="count-approved">2</span>
      <span class="chip-label">Approved</span>
    </div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
  <button class="filter-btn" onclick="setFilter('hold', this)">Holds</button>
  <button class="filter-btn" onclick="setFilter('missed', this)">Missed Pickups</button>
  <button class="filter-btn" onclick="setFilter('update', this)">Account Updates</button>
  <button class="filter-btn" onclick="setFilter('new_customer', this)">New customers</button>
</div>

<!-- EVENING DIGEST -->
<!-- /api/requests-settings existed from the first release and no screen ever
     called it, so the notify address could only be changed with curl. The
     digest would have inherited exactly that. -->
<div class="digest-bar">
  <div class="digest-row">
    <label class="digest-toggle">
      <input type="checkbox" id="digest-enabled" onchange="saveDigest()">
      <span>Email me an evening summary</span>
    </label>
    <label class="digest-hour">at
      <select id="digest-hour" onchange="saveDigest()"></select>
    </label>
    <span class="digest-to" id="digest-to"></span>
    <span class="digest-spacer"></span>
    <button class="btn-send" onclick="previewDigest()">Preview</button>
    <button class="btn-send" onclick="sendDigestNow()">Send now</button>
  </div>
  <pre class="digest-preview" id="digest-preview" style="display:none;"></pre>
  <div class="digest-status" id="digest-status"></div>
</div>

<!-- REQUEST LIST -->
<div class="list" id="request-list"></div>

<!-- The "all demo pages" block that used to sit here — pitch deck, iPhone
     preview, style editor — belonged to this page when it was a mockup being
     shown to people. It is now the screen Alyssa works out of every day, and
     a sales reel in the middle of an inbox is just noise. Those pages are all
     linked from hub.html, which is where browsing belongs.
     Removed 2026-09-18. -->
<!-- DEMO LINKS REMOVED -->

<script>
  /* Live data. This page used to hold 22 hardcoded rows and flip a local
     variable when you pressed Approve — nothing was stored and nothing
     reached the office. It now reads the real queue and the buttons really
     decide. */

  let REQUESTS = [];
  let ROUTE_TABS = [];
  let currentFilter = 'all';
  let busy = new Set();

  const KIND_BADGE = {
    new_customer: 'badge-update', hold: 'badge-hold',
    missed: 'badge-missed', update: 'badge-update',
  };
  const KIND_LABEL = {
    new_customer: 'New customer', hold: 'Service hold',
    missed: 'Missed pickup', update: 'Account update',
  };

  /* ── Evening digest ──────────────────────────────────────────────────── */

  let digestSettings = null;

  function hourLabel(h) {
    const suffix = h < 12 ? 'am' : 'pm';
    const twelve = h % 12 === 0 ? 12 : h % 12;
    return twelve + ':00' + suffix;
  }

  async function loadDigestSettings() {
    const sel = document.getElementById('digest-hour');
    if (sel && !sel.options.length) {
      for (let h = 0; h < 24; h++) {
        const o = document.createElement('option');
        o.value = String(h);
        o.textContent = hourLabel(h);
        sel.appendChild(o);
      }
    }
    try {
      const res = await fetch('/api/requests-settings');
      if (!res.ok) return;
      digestSettings = await res.json();
      document.getElementById('digest-enabled').checked = digestSettings.digest_enabled === '1';
      sel.value = String(Number(digestSettings.digest_hour));
      const to = document.getElementById('digest-to');
      /* Say where it goes. An evening summary silently addressed to an old
         address is the same failure as a route tab nobody can write to. */
      to.textContent = digestSettings.notify_email
        ? 'to ' + digestSettings.notify_email
        : 'no recipient set — nothing will be sent';
    } catch { /* the queue still works without this */ }
  }

  async function saveDigest() {
    const status = document.getElementById('digest-status');
    const body = {
      digest_enabled: document.getElementById('digest-enabled').checked ? '1' : '0',
      digest_hour: Number(document.getElementById('digest-hour').value),
    };
    status.textContent = 'Saving…';
    try {
      const res = await fetch('/api/requests-settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      digestSettings = await res.json();
      status.textContent = digestSettings.digest_enabled === '1'
        ? 'Summary will be sent each day after ' + hourLabel(Number(digestSettings.digest_hour)) + '.'
        : 'Evening summary is off.';
    } catch (e) {
      status.textContent = 'Could not save: ' + e.message;
    }
  }

  async function previewDigest() {
    const pre = document.getElementById('digest-preview');
    const status = document.getElementById('digest-status');
    status.textContent = 'Loading…';
    try {
      const res = await fetch('/api/digest');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      pre.textContent = data.subject + '\n\n' + data.text;
      pre.style.display = 'block';
      status.textContent = 'This is what today\u2019s email would say.';
    } catch (e) {
      status.textContent = 'Could not load preview: ' + e.message;
    }
  }

  async function sendDigestNow() {
    const status = document.getElementById('digest-status');
    status.textContent = 'Sending…';
    try {
      const res = await fetch('/api/digest/send', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      /* ok:false is not an error — it means the send was refused for a reason
         worth reading, like no sending domain configured. Saying "sent" there
         is the exact failure this codebase keeps digging out. */
      status.textContent = data.ok
        ? 'Sent.'
        : 'Not sent — ' + (data.reason || 'unknown reason') + '.';
    } catch (e) {
      status.textContent = 'Could not send: ' + e.message;
    }
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pillClass(s) {
    return { pending:'pill-pending', approved:'pill-approved', declined:'pill-declined' }[s] || '';
  }
  function pillLabel(s) {
    return { pending:'Pending', approved:'Approved', declined:'Declined' }[s] || s;
  }

  function whenText(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const today = new Date().toDateString() === d.toDateString();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return (today ? 'Today ' : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ') + time;
  }

  function addressText(r) {
    return [r.address, r.city].filter(Boolean).join(', ');
  }

  /* What the card says under the name. Requests carry a free-text detail from
     the portal; a new customer has an address instead. The address gets its
     own line (addressHtml) rather than standing in for the detail — a hold or
     a missed pickup now carries both, and the address is the half that says
     WHICH stop this is about. */
  function detailText(r) {
    return r.detail || addressText(r) || r.notes || '';
  }

  /* Only when it is not already the detail line, so a new customer's card
     does not print its address twice. */
  function addressHtml(r) {
    const addr = addressText(r);
    if (!addr || detailText(r) === addr) return '';
    return '<div class="card-address">📍 ' + esc(addr) + '</div>';
  }

  async function load() {
    try {
      const [reqRes, tabRes] = await Promise.all([
        fetch('/api/requests'),
        fetch('/api/tabs').catch(() => null),
      ]);
      if (!reqRes.ok) throw new Error('HTTP ' + reqRes.status);
      const data = await reqRes.json();
      REQUESTS = data.items || [];
      if (tabRes && tabRes.ok) ROUTE_TABS = (await tabRes.json()).tabs || [];
      render();
    } catch (err) {
      document.getElementById('request-list').innerHTML =
        '<div class="empty">Could not load requests.<br><small>' + esc(err.message) + '</small></div>';
    }
  }

  function actionsHtml(r) {
    if (r.status !== 'pending') return '';
    if (busy.has(r.id)) return '<div class="card-actions"><em>Saving…</em></div>';

    // Only a new customer needs somewhere to go. Everything else is just
    // "handled" — approving a hold should not add anyone to a route.
    /* Price is optional. Approving without one still puts them on a route —
       it just leaves the invoicing to be done by hand, which is where this
       was before. Nothing is blocked on QuickBooks. */
    const picker = r.kind === 'new_customer'
      ? '<select id="tab-' + esc(r.id) + '" class="tab-pick">' +
          '<option value="">Which route?</option>' +
          ROUTE_TABS.map(t => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join('') +
        '</select>' +
        '<input id="amt-' + esc(r.id) + '" class="amount-pick" type="text" ' +
          'inputmode="decimal" placeholder="$ / month" ' +
          'title="Leave blank to skip invoicing and add them to the route only">'
      : '';

    return '<div class="card-actions">' + picker +
      '<button class="btn-approve" onclick="doApprove(\'' + esc(r.id) + '\')">Approve</button>' +
      '<button class="btn-decline" onclick="doDecline(\'' + esc(r.id) + '\')">Decline</button>' +
      '</div>';
  }

  /* What QuickBooks did, shown only once there is something to say. An
     approved customer with no QBO row at all was approved without a price,
     which is a choice rather than a failure, so it says nothing. */
  function qboHtml(r) {
    if (r.status !== 'approved') return '';
    if (!r.qbo_invoice_id && !r.qbo_error) return '';

    if (r.qbo_error) {
      return '<div class="qbo-line">' +
        '<span class="qbo-tag failed">Not invoiced</span>' +
        '<span>' + esc(r.qbo_error) + '</span>' +
        '</div>';
    }

    const amount = r.plan_amount ? '$' + esc(r.plan_amount) : '';
    let out = '<div class="qbo-line">' +
      '<span class="qbo-tag">Invoiced' + (amount ? ' ' + amount : '') + '</span>';

    if (r.qbo_pay_link) {
      out += '<a class="qbo-link" href="' + esc(r.qbo_pay_link) + '" target="_blank" rel="noopener">Payment link</a>' +
             '<button class="qbo-copy" onclick="copyPayLink(this, \'' + esc(r.id) + '\')">Copy</button>';
    } else {
      out += '<span>No payment link — switch on QuickBooks Payments to get one.</span>';
    }
    return out + '</div>';
  }

  window.copyPayLink = async function (btn, id) {
    const r = REQUESTS.find(x => x.id === id);
    if (!r || !r.qbo_pay_link) return;
    const original = btn.textContent;
    try {
      await navigator.clipboard.writeText(r.qbo_pay_link);
      btn.textContent = 'Copied';
    } catch {
      /* Older webviews refuse the clipboard. Select it so it can be copied
         by hand rather than claiming a copy that did not happen. */
      const a = btn.previousElementSibling;
      if (a) {
        const range = document.createRange();
        range.selectNodeContents(a);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      btn.textContent = 'Select and copy';
    }
    setTimeout(() => { btn.textContent = original; }, 2500);
  };

  function render() {
    const list = document.getElementById('request-list');
    const filtered = REQUESTS.filter(r => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'pending') return r.status === 'pending';
      return r.kind === currentFilter;
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">No requests to show.</div>';
      updateCounts();
      return;
    }

    list.innerHTML = filtered.map(r => {
      const contact = [r.email, r.phone].filter(Boolean).join(' · ');
      return '<div class="request-card ' + (r.status !== 'pending' ? 'resolved' : '') + '" id="card-' + esc(r.id) + '">' +
        '<div class="card-top">' +
          '<span class="type-badge ' + (KIND_BADGE[r.kind] || '') + '">' + esc(KIND_LABEL[r.kind] || r.kind) + '</span>' +
          '<div class="card-info">' +
            '<div class="card-customer">' + esc(r.name) + '</div>' +
            '<div class="card-detail">' + esc(detailText(r)) + '</div>' +
            addressHtml(r) +
            '<div class="card-meta">' + esc(contact) + (contact ? ' · ' : '') + esc(whenText(r.created_at)) +
              (r.decided_tab ? ' · added to ' + esc(r.decided_tab) : '') + '</div>' +
          '</div>' +
          '<span class="status-pill ' + pillClass(r.status) + '">' + pillLabel(r.status) + '</span>' +
        '</div>' +
        actionsHtml(r) +
        qboHtml(r) +
      '</div>';
    }).join('');

    updateCounts();
  }

  function updateCounts() {
    const pending  = REQUESTS.filter(r => r.status === 'pending').length;
    const approved = REQUESTS.filter(r => r.status === 'approved').length;
    const pEl = document.getElementById('count-pending');
    const aEl = document.getElementById('count-approved');
    if (pEl) pEl.textContent = pending;
    if (aEl) aEl.textContent = approved;
  }

  async function decide(id, action, body) {
    busy.add(id); render();
    try {
      const res = await fetch('/api/requests/' + encodeURIComponent(id) + '/' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      const i = REQUESTS.findIndex(r => r.id === id);
      if (i >= 0 && data.id) REQUESTS[i] = data;
    } catch (err) {
      alert(err.message);
    } finally {
      busy.delete(id); render();
    }
  }

  window.doApprove = function (id) {
    const r = REQUESTS.find(x => x.id === id);
    const body = {};
    if (r && r.kind === 'new_customer') {
      const sel = document.getElementById('tab-' + id);
      const tabName = sel ? sel.value : '';
      if (!tabName) { alert('Pick which route they go on first.'); return; }
      body.tabName = tabName;

      /* Accept "45", "$45", "45.00" — whatever gets typed in a hurry. An
         empty box means no invoice, not a zero one. */
      const raw = (document.getElementById('amt-' + id)?.value || '').replace(/[^0-9.]/g, '');
      if (raw) {
        const amount = Number(raw);
        if (!Number.isFinite(amount) || amount <= 0) {
          alert('That price does not look right. Leave it blank to add them to the route without invoicing.');
          return;
        }
        body.amount = String(amount);
        body.planLabel = r.service || '';
      }
    }
    decide(id, 'approve', body);
  };

  window.doDecline = function (id) { decide(id, 'decline'); };

  window.setFilter = function (f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };

  // The server already broadcasts these, so a request submitted from the
  // portal shows up here without a refresh.
  (function live() {
    try {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto + '//' + location.host + '/ws');
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'request-created' || msg.type === 'request-decided') load();
      };
      ws.onclose = () => setTimeout(live, 5000);
      ws.onerror = () => console.warn('[approval] live updates dropped; will retry');
    } catch (err) {
      // Without this the queue silently stops updating itself and the only
      // symptom is requests appearing late, which looks like the portal is
      // broken rather than the socket.
      console.warn('[approval] live updates unavailable:', err.message);
    }
  })();

  load();
  loadDigestSettings();
</script>

</body></html>
