<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evergreen — Style Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #e8f0e4;
    --bg-opacity: 1;
    --card-bg: #ffffff;
    --card-opacity: 1;
    --text: #1a2e17;
    --header-bg: #2d5a27;
    --header-text: #ffffff;
    --accent: #4a9e3f;
    --done-bg: #d6edcf;
    --done-text: #1a5c12;
    --border: #c8dbc4;
    --font-size: 15px;
    --font-weight: 400;
    --line-height: 1.5;
    --radius: 10px;
  }

  body {
    font-family: 'Google Sans Flex', -apple-system, sans-serif;
    font-size: 14px;
    background: #1a1a1a;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: #111;
    border-bottom: 1px solid #333;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 { font-size: 1em; font-weight: 700; color: #fff; }
  header a { font-size: 0.85em; color: #aaa; text-decoration: none; }
  header a:hover { color: #fff; }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── PANEL ── */
  .panel {
    width: 300px;
    flex-shrink: 0;
    background: #1e1e1e;
    border-right: 1px solid #333;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel-section h2 {
    font-size: 0.72em;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #333;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .control-row label {
    font-size: 0.82em;
    color: #ccc;
    flex: 1;
    white-space: nowrap;
  }

  .control-row .inputs {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type=color] {
    width: 34px;
    height: 28px;
    border: none;
    border-radius: 6px;
    padding: 2px;
    background: #333;
    cursor: pointer;
  }

  input[type=range] {
    width: 90px;
    accent-color: #4a9e3f;
    cursor: pointer;
  }

  .val-display {
    font-size: 0.78em;
    color: #aaa;
    min-width: 32px;
    text-align: right;
  }

  .opacity-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: -4px;
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .opacity-row label { font-size: 0.75em; color: #888; }
  .opacity-row input[type=range] { width: 80px; }

  /* ── PUSH BUTTON ── */
  .push-btn {
    width: 100%;
    padding: 12px;
    background: #4a9e3f;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95em;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .push-btn:hover { background: #3a8030; }
  .push-btn:active { background: #2d6225; }

  .reset-btn {
    width: 100%;
    padding: 8px;
    background: transparent;
    color: #888;
    border: 1px solid #444;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.82em;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .reset-btn:hover { color: #fff; border-color: #888; }

  #push-status {
    font-size: 0.8em;
    text-align: center;
    color: #4a9e3f;
    min-height: 1.4em;
  }

  /* ── PREVIEW ── */
  .preview {
    flex: 1;
    overflow: hidden;
  }

  .preview iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<header>
  <h1>🌿 Evergreen — Style Editor</h1>
  <a href="/">← Driver view</a>
</header>

<div class="layout">
  <div class="panel">

    <div class="panel-section">
      <h2>Colors</h2>

      <div class="control-row">
        <label>Page background</label>
        <div class="inputs">
          <input type="color" data-var="--bg" value="#e8f0e4">
        </div>
      </div>
      <div class="opacity-row">
        <label>Opacity</label>
        <input type="range" data-var="--bg-opacity" min="0" max="1" step="0.01" value="1">
        <span class="val-display" data-for="--bg-opacity">1</span>
      </div>

      <div class="control-row">
        <label>Card background</label>
        <div class="inputs">
          <input type="color" data-var="--card-bg" value="#ffffff">
        </div>
      </div>
      <div class="opacity-row">
        <label>Opacity</label>
        <input type="range" data-var="--card-opacity" min="0" max="1" step="0.01" value="1">
        <span class="val-display" data-for="--card-opacity">1</span>
      </div>

      <div class="control-row">
        <label>Text</label>
        <div class="inputs">
          <input type="color" data-var="--text" value="#1a2e17">
        </div>
      </div>

      <div class="control-row">
        <label>Header background</label>
        <div class="inputs">
          <input type="color" data-var="--header-bg" value="#2d5a27">
        </div>
      </div>

      <div class="control-row">
        <label>Header text</label>
        <div class="inputs">
          <input type="color" data-var="--header-text" value="#ffffff">
        </div>
      </div>

      <div class="control-row">
        <label>Accent / checkmark</label>
        <div class="inputs">
          <input type="color" data-var="--accent" value="#4a9e3f">
        </div>
      </div>

      <div class="control-row">
        <label>Done card background</label>
        <div class="inputs">
          <input type="color" data-var="--done-bg" value="#d6edcf">
        </div>
      </div>

      <div class="control-row">
        <label>Done card text</label>
        <div class="inputs">
          <input type="color" data-var="--done-text" value="#1a5c12">
        </div>
      </div>

      <div class="control-row">
        <label>Border / divider</label>
        <div class="inputs">
          <input type="color" data-var="--border" value="#c8dbc4">
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Typography</h2>

      <div class="control-row">
        <label>Font size</label>
        <div class="inputs">
          <input type="range" data-var="--font-size" min="11" max="24" step="0.5" value="15">
          <span class="val-display" data-for="--font-size">15px</span>
        </div>
      </div>

      <div class="control-row">
        <label>Font weight</label>
        <div class="inputs">
          <input type="range" data-var="--font-weight" min="100" max="900" step="100" value="400">
          <span class="val-display" data-for="--font-weight">400</span>
        </div>
      </div>

      <div class="control-row">
        <label>Line height</label>
        <div class="inputs">
          <input type="range" data-var="--line-height" min="1.1" max="2.2" step="0.05" value="1.5">
          <span class="val-display" data-for="--line-height">1.5</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Shape</h2>

      <div class="control-row">
        <label>Corner radius</label>
        <div class="inputs">
          <input type="range" data-var="--radius" min="0" max="28" step="1" value="10">
          <span class="val-display" data-for="--radius">10px</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div id="push-status"></div>
      <button class="push-btn" id="push-btn">Save &amp; Push to All Drivers</button>
      <br>
      <button class="reset-btn" id="reset-btn">Reset to defaults</button>
    </div>

  </div>

  <div class="preview">
    <iframe id="preview-frame" src="/"></iframe>
  </div>
</div>

<script>
const frame = document.getElementById('preview-frame');
const pushStatus = document.getElementById('push-status');

// Collect current styles from controls
function collectStyles() {
  const styles = {};
  document.querySelectorAll('[data-var]').forEach(el => {
    const key = el.dataset.var;
    let val = el.value;
    // Strip units for storage — server stores raw numbers
    styles[key] = val;
  });
  return styles;
}

// Apply styles to this page's :root and to the iframe
function applyToPreview(styles) {
  const root = document.documentElement;
  const iframeRoot = frame.contentDocument?.documentElement;
  for (const [key, val] of Object.entries(styles)) {
    const cssVal = (key === '--font-size' || key === '--radius') ? val + 'px' : val;
    root.style.setProperty(key, cssVal);
    iframeRoot?.style.setProperty(key, cssVal);
  }
}

// Update value display labels
function updateDisplay(varName, value) {
  const el = document.querySelector(`.val-display[data-for="${varName}"]`);
  if (!el) return;
  if (varName === '--font-size') el.textContent = value + 'px';
  else if (varName === '--radius') el.textContent = value + 'px';
  else el.textContent = value;
}

// Wire up all controls
document.querySelectorAll('[data-var]').forEach(el => {
  el.addEventListener('input', () => {
    updateDisplay(el.dataset.var, el.value);
    applyToPreview(collectStyles());
  });
});

// Load saved styles from server and populate controls
async function loadStyles() {
  const res = await fetch('/api/styles');
  const styles = await res.json();
  for (const [key, val] of Object.entries(styles)) {
    const el = document.querySelector(`[data-var="${key}"]`);
    if (el) { el.value = val; updateDisplay(key, val); }
  }
  applyToPreview(styles);
}

// Re-apply after iframe loads
frame.addEventListener('load', () => {
  applyToPreview(collectStyles());
});

// Push to server + broadcast
document.getElementById('push-btn').addEventListener('click', async () => {
  const styles = collectStyles();
  pushStatus.textContent = 'Saving…';
  try {
    const res = await fetch('/api/styles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(styles)
    });
    if (!res.ok) throw new Error('Server error');
    pushStatus.textContent = '✓ Pushed to all drivers!';
    setTimeout(() => pushStatus.textContent = '', 3000);
  } catch {
    pushStatus.textContent = '✗ Error saving';
  }
});

// Reset to defaults
document.getElementById('reset-btn').addEventListener('click', async () => {
  if (!confirm('Reset all styles to defaults?')) return;
  const res = await fetch('/api/styles/reset', { method: 'POST' });
  const styles = await res.json();
  for (const [key, val] of Object.entries(styles)) {
    const el = document.querySelector(`[data-var="${key}"]`);
    if (el) { el.value = val; updateDisplay(key, val); }
  }
  applyToPreview(styles);
  pushStatus.textContent = '✓ Reset and pushed!';
  setTimeout(() => pushStatus.textContent = '', 3000);
});

loadStyles();
</script>
</body>
</html>
