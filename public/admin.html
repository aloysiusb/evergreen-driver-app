<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evergreen — Style Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Google Sans Flex', -apple-system, sans-serif;
    font-size: 14px;
    background: #1a1a1a;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: #111;
    border-bottom: 1px solid #333;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 1em; font-weight: 700; color: #fff; }
  header a { font-size: 0.85em; color: #aaa; text-decoration: none; }
  header a:hover { color: #fff; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── PANEL ── */
  .panel {
    width: 300px;
    flex-shrink: 0;
    background: #1e1e1e;
    border-right: 1px solid #333;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel-section h2 {
    font-size: 0.72em;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #333;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .control-row label { font-size: 0.82em; color: #ccc; flex: 1; }

  .control-row .inputs { display: flex; align-items: center; gap: 6px; }

  input[type=color] {
    width: 34px; height: 28px;
    border: none; border-radius: 6px;
    padding: 2px; background: #333; cursor: pointer;
  }

  input[type=range] {
    width: 90px;
    accent-color: #4a9e3f;
    cursor: pointer;
  }

  .val-display {
    font-size: 0.78em; color: #aaa;
    min-width: 36px; text-align: right;
  }

  .push-btn {
    width: 100%; padding: 12px;
    background: #4a9e3f; color: #fff;
    border: none; border-radius: 8px;
    font-family: inherit; font-size: 0.95em; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .push-btn:hover { background: #3a8030; }

  .reset-btn {
    width: 100%; padding: 8px;
    background: transparent; color: #888;
    border: 1px solid #444; border-radius: 8px;
    font-family: inherit; font-size: 0.82em;
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .reset-btn:hover { color: #fff; border-color: #888; }

  #push-status {
    font-size: 0.8em; text-align: center;
    color: #4a9e3f; min-height: 1.4em;
  }

  input[type=text] {
    background: #2a2a2a; color: #f0f0f0;
    border: 1px solid #444; border-radius: 6px;
    padding: 5px 8px; font-family: inherit; font-size: 0.82em;
    width: 160px;
  }
  input[type=text]:focus { outline: 1px solid #4a9e3f; border-color: transparent; }

  /* ── PREVIEW ── */
  .preview { flex: 1; overflow: hidden; }
  .preview iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<header>
  <h1>🌿 Evergreen — Style Editor</h1>
  <a href="/">← Driver view</a>
</header>

<div class="layout">
  <div class="panel">

    <div class="panel-section">
      <h2>Page</h2>
      <div class="control-row">
        <label>Logo</label>
        <div class="inputs"><input type="text" data-text="site-logo" value="🌿" maxlength="8" placeholder="emoji or text"></div>
      </div>
      <div class="control-row">
        <label>Heading</label>
        <div class="inputs"><input type="text" data-text="site-heading" value="Evergreen Compost" maxlength="40"></div>
      </div>
      <div class="control-row">
        <label>Subheading</label>
        <div class="inputs"><input type="text" data-text="site-subhead" value="Tap your route to get started" maxlength="60"></div>
      </div>
      <div class="control-row">
        <label>Background</label>
        <div class="inputs"><input type="color" data-var="--bg" value="#f4f4f5"></div>
      </div>
      <div class="control-row">
        <label>Home header bg</label>
        <div class="inputs"><input type="color" data-var="--home-header-bg" value="#18181b"></div>
      </div>
      <div class="control-row">
        <label>Home header text</label>
        <div class="inputs"><input type="color" data-var="--home-header-text" value="#ffffff"></div>
      </div>
      <div class="control-row">
        <label>Header padding</label>
        <div class="inputs">
          <input type="range" data-var="--home-header-padding" min="8" max="80" step="2" value="36">
          <span class="val-display" data-for="--home-header-padding">36px</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Cards &amp; Stops</h2>
      <div class="control-row">
        <label>Card background</label>
        <div class="inputs"><input type="color" data-var="--surface" value="#ffffff"></div>
      </div>
      <div class="control-row">
        <label>Border / divider</label>
        <div class="inputs"><input type="color" data-var="--border" value="#e4e4e7"></div>
      </div>
      <div class="control-row">
        <label>Corner radius</label>
        <div class="inputs">
          <input type="range" data-var="--radius" min="0" max="28" step="1" value="12">
          <span class="val-display" data-for="--radius">12px</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Text</h2>
      <div class="control-row">
        <label>Primary text</label>
        <div class="inputs"><input type="color" data-var="--text" value="#18181b"></div>
      </div>
      <div class="control-row">
        <label>Secondary text</label>
        <div class="inputs"><input type="color" data-var="--text-muted" value="#71717a"></div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Typography</h2>
      <div class="control-row">
        <label>Font size</label>
        <div class="inputs">
          <input type="range" data-var="--font-size" min="11" max="24" step="0.5" value="16">
          <span class="val-display" data-for="--font-size">16px</span>
        </div>
      </div>
      <div class="control-row">
        <label>Font weight</label>
        <div class="inputs">
          <input type="range" data-var="--font-weight" min="100" max="900" step="100" value="400">
          <span class="val-display" data-for="--font-weight">400</span>
        </div>
      </div>
      <div class="control-row">
        <label>Line height</label>
        <div class="inputs">
          <input type="range" data-var="--line-height" min="1.1" max="2.2" step="0.05" value="1.5">
          <span class="val-display" data-for="--line-height">1.5</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Driver Page</h2>
      <div class="control-row">
        <label>Route header text</label>
        <div class="inputs"><input type="color" data-var="--route-header-text" value="#ffffff"></div>
      </div>
      <div class="control-row">
        <label>Done button color</label>
        <div class="inputs"><input type="color" data-var="--done-btn-bg" value="#22c55e"></div>
      </div>
      <div class="control-row">
        <label>Done button text</label>
        <div class="inputs"><input type="color" data-var="--done-btn-text" value="#ffffff"></div>
      </div>
      <div class="control-row">
        <label>Completed button color</label>
        <div class="inputs"><input type="color" data-var="--done-btn-done-bg" value="#93c5fd"></div>
      </div>
      <div class="control-row">
        <label>Completed stop bg</label>
        <div class="inputs"><input type="color" data-var="--stop-done-bg" value="#f0fdf4"></div>
      </div>
      <div class="control-row">
        <label>Completed stop border</label>
        <div class="inputs"><input type="color" data-var="--stop-done-border" value="#bbf7d0"></div>
      </div>
      <div class="control-row">
        <label>Action bar bg</label>
        <div class="inputs"><input type="color" data-var="--action-bar-bg" value="#ffffff"></div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Route Cards &amp; Headers</h2>
      <div class="control-row">
        <label>Card text color</label>
        <div class="inputs"><input type="color" data-var="route-card-text" value="#ffffff"></div>
      </div>
      <div class="control-row">
        <label>Card corner radius</label>
        <div class="inputs">
          <input type="range" data-var="--route-card-radius" min="0" max="40" step="1" value="16">
          <span class="val-display" data-for="--route-card-radius">16px</span>
        </div>
      </div>
      <div class="control-row" style="margin-top:6px;">
        <label style="color:#555;font-size:0.75em;">Route color sets card bg + driver header</label>
      </div>
      <div class="control-row">
        <label>Tuesday DV</label>
        <div class="inputs"><input type="color" data-var="route-tues-dv" value="#0ea5e9"></div>
      </div>
      <div class="control-row">
        <label>Tuesday 4WD</label>
        <div class="inputs"><input type="color" data-var="route-tues-4wd" value="#f97316"></div>
      </div>
      <div class="control-row">
        <label>Wednesday DV Res</label>
        <div class="inputs"><input type="color" data-var="route-weds-res" value="#22c55e"></div>
      </div>
      <div class="control-row">
        <label>Wednesday Commercial</label>
        <div class="inputs"><input type="color" data-var="route-weds-commercial" value="#a855f7"></div>
      </div>
      <div class="control-row">
        <label>Thursday UV</label>
        <div class="inputs"><input type="color" data-var="route-thurs-uv" value="#06b6d4"></div>
      </div>
      <div class="control-row">
        <label>Thursday Com/Eagle</label>
        <div class="inputs"><input type="color" data-var="route-thurs-comeagle" value="#ef4444"></div>
      </div>
      <div class="control-row">
        <label>Friday</label>
        <div class="inputs"><input type="color" data-var="route-friday" value="#eab308"></div>
      </div>
      <div class="control-row">
        <label>Monday</label>
        <div class="inputs"><input type="color" data-var="route-monday" value="#ec4899"></div>
      </div>
      <div class="control-row">
        <label>Max Routes</label>
        <div class="inputs"><input type="color" data-var="route-max-routes" value="#6366f1"></div>
      </div>
    </div>

    <div class="panel-section">
      <div id="push-status"></div>
      <button class="push-btn" id="push-btn">Save &amp; Push to All Drivers</button>
      <br>
      <button class="reset-btn" id="reset-btn">Reset to defaults</button>
    </div>

  </div>

  <div class="preview">
    <iframe id="preview-frame" src="/"></iframe>
  </div>
</div>

<script>
const frame = document.getElementById('preview-frame');
const pushStatus = document.getElementById('push-status');

function collectStyles() {
  const styles = {};
  document.querySelectorAll('[data-var]').forEach(el => {
    styles[el.dataset.var] = el.value;
  });
  document.querySelectorAll('[data-text]').forEach(el => {
    styles[el.dataset.text] = el.value;
  });
  return styles;
}

function applyToPreview(styles) {
  const iframeDoc = frame.contentDocument;
  if (!iframeDoc) return;
  const iframeRoot = iframeDoc.documentElement;

  // Apply CSS custom properties
  for (const [key, val] of Object.entries(styles)) {
    if (key.startsWith('--')) {
      const needsPx = ['--font-size','--radius','--route-card-radius','--home-header-padding'].includes(key);
      iframeRoot.style.setProperty(key, needsPx ? val + 'px' : val);
    }
  }

  // Re-render route cards with updated colors
  const grid = iframeDoc.getElementById('route-grid');
  const ROUTES = frame.contentWindow.ROUTES;
  if (grid && ROUTES) {
    const cardText = styles['route-card-text'] || '#ffffff';
    grid.innerHTML = ROUTES.map(r => {
      const bg = styles['route-' + r.id] || r.color;
      return `<a class="route-card" href="/driver/${r.id}" style="background:${bg};color:${cardText};">
        <div class="route-card-day">${r.day}</div>
        <div class="route-card-name">${r.name}</div>
      </a>`;
    }).join('');
  }

  // Apply editable text content to preview (empty string collapses via CSS :empty)
  const setText = (id, val) => { const el = iframeDoc.getElementById(id); if (el) el.textContent = val ?? ''; };
  setText('site-logo',    styles['site-logo']);
  setText('site-heading', styles['site-heading']);
  setText('site-subhead', styles['site-subhead']);
}

function updateDisplay(varName, value) {
  const el = document.querySelector(`.val-display[data-for="${varName}"]`);
  if (!el) return;
  const needsPx = ['--font-size','--radius','--route-card-radius','--home-header-padding'].includes(varName);
  el.textContent = needsPx ? value + 'px' : value;
}

document.querySelectorAll('[data-var], [data-text]').forEach(el => {
  el.addEventListener('input', () => {
    if (el.dataset.var) updateDisplay(el.dataset.var, el.value);
    applyToPreview(collectStyles());
  });
});

async function loadStyles() {
  const res = await fetch('/api/styles');
  const styles = await res.json();
  for (const [key, val] of Object.entries(styles)) {
    const varEl  = document.querySelector(`[data-var="${key}"]`);
    const textEl = document.querySelector(`[data-text="${key}"]`);
    if (varEl)  { varEl.value  = val; updateDisplay(key, val); }
    if (textEl) { textEl.value = val; }
  }
  applyToPreview(styles);
}

frame.addEventListener('load', () => applyToPreview(collectStyles()));

document.getElementById('push-btn').addEventListener('click', async () => {
  pushStatus.textContent = 'Saving…';
  try {
    const res = await fetch('/api/styles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(collectStyles())
    });
    if (!res.ok) throw new Error();
    pushStatus.textContent = '✓ Pushed to all drivers!';
    setTimeout(() => pushStatus.textContent = '', 3000);
  } catch {
    pushStatus.textContent = '✗ Error saving';
  }
});

document.getElementById('reset-btn').addEventListener('click', async () => {
  if (!confirm('Reset all styles to defaults?')) return;
  const res = await fetch('/api/styles/reset', { method: 'POST' });
  const styles = await res.json();
  for (const [key, val] of Object.entries(styles)) {
    const el = document.querySelector(`[data-var="${key}"]`);
    if (el) { el.value = val; updateDisplay(key, val); }
  }
  applyToPreview(styles);
  pushStatus.textContent = '✓ Reset and pushed!';
  setTimeout(() => pushStatus.textContent = '', 3000);
});

loadStyles();
</script>
</body>
</html>
